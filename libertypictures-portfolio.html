<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Libertypictures</title>
    <meta name="description" content="Libertypictures portfolio — real work across portraits, couples, maternity, family, and corporate photography.">
    <meta name="theme-color" content="#8a7355">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23000000'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Georgia, serif' fill='%23c4a67e' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #faf8f4; --bg-container: #ffffff; --bg-card: #fefdfb;
            --text-primary: #1a1815; --text-secondary: #6b6459; --accent: #8a7355;
            --border-color: #e8e3d9; --btn-primary-bg: #1a1815; --btn-primary-text: #ffffff;
            --shadow-subtle: rgba(26,24,21,0.04); --radius-lg: 18px; --radius-md: 12px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #161513; --bg-container: #1f1e1b; --bg-card: #262521;
                --text-primary: #f3f0ea; --text-secondary: #a8a196; --accent: #c4a67e;
                --border-color: #35332d; --btn-primary-bg: #c4a67e; --btn-primary-text: #161513;
                --shadow-subtle: rgba(0,0,0,0.24);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-body); color: var(--text-primary); line-height: 1.65; -webkit-font-smoothing: antialiased; }
        .serif { font-family: 'Fraunces', serif; }
        img { max-width: 100%; display: block; }

        .container { max-width: 1080px; margin: 0 auto; padding: 0 40px; }
        .site-header { padding: 30px 0; }
        .lp-back-home { font-size: 12px; color: var(--text-secondary); text-decoration: none; transition: color 0.15s ease; }
        .lp-back-home:hover { color: var(--accent); }

        .page-hero { text-align: center; padding: 50px 0 70px; }
        .page-hero .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 16px; }
        .page-hero h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(30px, 5vw, 44px); margin-bottom: 14px; }
        .page-hero p { font-size: 14.5px; color: var(--text-secondary); max-width: 460px; margin: 0 auto; line-height: 1.8; }

        .category-block { padding: 20px 0 60px; }
        .category-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); }
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .photo-item { border-radius: var(--radius-md); overflow: hidden; aspect-ratio: 4/5; background: var(--bg-card); box-shadow: 0 6px 20px var(--shadow-subtle); cursor: pointer; border: none; padding: 0; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .photo-item:hover img { transform: scale(1.05); }

        .empty-state { text-align: center; color: var(--text-secondary); font-size: 14px; padding: 100px 20px; }
        .empty-state a { color: var(--accent); }

        /* Lightbox — a simple, real enlarge-on-click view */
        .lightbox { position: fixed; inset: 0; background: rgba(10,9,8,0.94); z-index: 100; display: none; align-items: center; justify-content: center; padding: 30px; }
        .lightbox.is-open { display: flex; }
        .lightbox img { max-width: 90vw; max-height: 88vh; border-radius: 4px; }
        .lightbox-close { position: absolute; top: 24px; right: 30px; background: none; border: none; color: #fff; font-size: 32px; cursor: pointer; line-height: 1; }

        .cta-band { text-align: center; padding: 90px 0; background: var(--bg-container); border-top: 1px solid var(--border-color); }
        .cta-band h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 28px; margin-bottom: 16px; }
        .cta-band p { font-size: 14px; color: var(--text-secondary); margin-bottom: 30px; }
        .btn-dark { display: inline-block; background: var(--btn-primary-bg); color: var(--btn-primary-text); padding: 16px 36px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.8px; border-radius: 30px; text-decoration: none; transition: all 0.35s cubic-bezier(0.16,1,0.3,1); }
        .btn-dark:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 16px 32px rgba(138,115,85,0.28); }

        .brand-footer { padding: 50px 0; text-align: center; }
        .footer-mark { font-size: 15px; font-weight: 500; }

        @media (max-width: 700px) {
            .container { padding: 0 22px; }
            .photo-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container"><a href="./" class="lp-back-home">&larr; Back to Home</a></div>
    </header>

    <section class="page-hero">
        <div class="container">
            <div class="eyebrow">Portfolio</div>
            <h1 class="serif">A Glimpse of the Work</h1>
            <p>Real sessions, real clients — portraits, couples, maternity, family, and corporate photography.</p>
        </div>
    </section>

    <div id="portfolio-content" class="container">
        <p class="empty-state">Loading portfolio&hellip;</p>
    </div>

    <section class="cta-band">
        <div class="container">
            <h2 class="serif">Ready for your own session?</h2>
            <p>Choose a package, pick a date, and secure your slot.</p>
            <a href="book.html" class="btn-dark">Book a Session</a>
        </div>
    </section>

    <footer class="brand-footer">
        <span class="serif footer-mark">Libertypictures © 2026</span>
    </footer>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
        <img id="lightbox-img" src="" alt="">
    </div>

<script>
    var API_BASE = 'https://liberty-booking-api.visualsliberty.workers.dev';

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = String(str == null ? '' : str);
        return div.innerHTML;
    }

    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightbox-img');
    function openLightbox(url) {
        lightboxImg.src = url;
        lightbox.classList.add('is-open');
    }
    function closeLightbox() {
        lightbox.classList.remove('is-open');
        lightboxImg.src = '';
    }
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });

    (function () {
        var content = document.getElementById('portfolio-content');
        fetch(API_BASE + '/api/portfolio?publishedOnly=true')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var items = data.items || [];
                if (!items.length) {
                    content.innerHTML = '<p class="empty-state">New work is on its way \u2014 check back soon, or <a href="book.html">book a session</a> to be part of it.</p>';
                    return;
                }

                var byCategory = {};
                var order = [];
                items.forEach(function (item) {
                    if (!byCategory[item.category]) { byCategory[item.category] = []; order.push(item.category); }
                    byCategory[item.category].push(item);
                });

                content.innerHTML = order.map(function (category) {
                    var photos = byCategory[category];
                    return '<div class="category-block">' +
                        '<h2 class="category-title">' + escapeHtml(category) + '</h2>' +
                        '<div class="photo-grid">' +
                        photos.map(function (p) {
                            return '<button type="button" class="photo-item" data-url="' + API_BASE + p.imageUrl + '"><img src="' + API_BASE + p.imageUrl + '" alt="' + escapeHtml(category) + '" loading="lazy"></button>';
                        }).join('') +
                        '</div></div>';
                }).join('');

                content.querySelectorAll('.photo-item').forEach(function (btn) {
                    btn.addEventListener('click', function () { openLightbox(btn.dataset.url); });
                });
            })
            .catch(function (err) {
                content.innerHTML = '<p class="empty-state">Couldn\'t load the portfolio right now \u2014 please refresh.</p>';
                console.error('Could not load portfolio:', err);
            });
    })();
</script>

</body></html>
