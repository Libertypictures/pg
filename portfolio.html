<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Libertypictures</title>
    <meta name="description" content="Libertypictures portfolio — real work across portraits, couples, maternity, family, and corporate photography.">
    <meta name="theme-color" content="#8a7355">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23000000'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Georgia, serif' fill='%23c4a67e' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #faf8f4; --bg-container: #ffffff; --bg-card: #fefdfb;
            --text-primary: #1a1815; --text-secondary: #6b6459; --accent: #8a7355; --accent-deep: #6e5c44;
            --border-color: #e8e3d9; --btn-primary-bg: #1a1815; --btn-primary-text: #ffffff;
            --shadow-subtle: rgba(26,24,21,0.04); --radius-lg: 18px; --radius-md: 12px; --logo-filter: invert(0);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #161513; --bg-container: #1f1e1b; --bg-card: #262521;
                --text-primary: #f3f0ea; --text-secondary: #a8a196; --accent: #c4a67e; --accent-deep: #d9bf98;
                --border-color: #35332d; --btn-primary-bg: #c4a67e; --btn-primary-text: #161513;
                --shadow-subtle: rgba(0,0,0,0.24); --logo-filter: invert(1);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-body); color: var(--text-primary); line-height: 1.65; -webkit-font-smoothing: antialiased; opacity: 0; animation: lp-page-in 0.7s ease 0.05s forwards; }
        @keyframes lp-page-in { to { opacity: 1; } }
        .serif { font-family: 'Fraunces', serif; }
        img { max-width: 100%; display: block; }

        .container { max-width: 1080px; margin: 0 auto; padding: 0 40px; }

        /* SITE HEADER — same fixed logo header as Home, frosted once
           scrolled past the initial pale hero band. */
        .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 26px 0; transition: padding 0.35s ease, background 0.35s ease, box-shadow 0.35s ease; }
        .site-header.is-scrolled { padding: 16px 0; background: rgba(250,248,244,0.72); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); box-shadow: 0 1px 0 var(--border-color); }
        @media (prefers-color-scheme: dark) { .site-header.is-scrolled { background: rgba(22,21,19,0.72); } }
        .site-logo-link { display: block; }
        .site-logo { height: 36px; width: auto; filter: var(--logo-filter, none); transition: height 0.35s ease; }
        .site-header.is-scrolled .site-logo { height: 30px; }

        .page-hero { text-align: center; padding: 130px 0 40px; }
        .page-hero .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 600; }
        .page-intro { font-family: 'Fraunces', serif; font-style: italic; font-size: clamp(16px, 2.4vw, 20px); color: var(--text-secondary); max-width: 480px; margin: 22px auto 0; line-height: 1.7; white-space: pre-line; }

        .category-block { padding: 20px 0 60px; }
        .category-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); }
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .photo-item { overflow: hidden; aspect-ratio: 4/5; background: var(--bg-card); box-shadow: 0 6px 20px var(--shadow-subtle); cursor: pointer; border: none; padding: 0; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .photo-item:hover img { transform: scale(1.05); }

        .empty-state { text-align: center; color: var(--text-secondary); font-size: 14px; padding: 100px 20px; }
        .empty-state a { color: var(--accent); }

        /* Lightbox — a simple, real enlarge-on-click view */
        .lightbox { position: fixed; inset: 0; background: rgba(10,9,8,0.94); z-index: 100; display: none; align-items: center; justify-content: center; padding: 30px; }
        .lightbox.is-open { display: flex; }
        .lightbox img { max-width: 90vw; max-height: 88vh; }
        .lightbox-close { position: absolute; top: 24px; right: 30px; background: none; border: none; color: #fff; font-size: 32px; cursor: pointer; line-height: 1; }

        .cta-band { text-align: center; padding: 90px 0; background: var(--bg-container); border-top: 1px solid var(--border-color); }
        .cta-band h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 28px; margin-bottom: 16px; }
        .cta-band p { font-size: 14px; color: var(--text-secondary); margin-bottom: 30px; }
        .btn-dark { display: inline-block; background: rgba(26,24,21,0.05); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); color: var(--text-primary); padding: 16px 36px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; border-radius: 100px; text-decoration: none; transition: all 0.4s cubic-bezier(0.16,1,0.3,1); border: none; cursor: pointer; box-shadow: 0 4px 20px var(--shadow-subtle), inset 0 1px 0 rgba(255,255,255,0.5); }
        .btn-dark:hover { background: rgba(138,115,85,0.16); color: var(--accent-deep); transform: translateY(-2px); box-shadow: 0 14px 32px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.6); }
        @media (prefers-color-scheme: dark) {
            .btn-dark { background: rgba(255,255,255,0.06); box-shadow: 0 4px 20px var(--shadow-subtle), inset 0 1px 0 rgba(255,255,255,0.08); }
            .btn-dark:hover { background: rgba(196,166,126,0.18); }
        }

        .brand-footer { padding: 50px 0; text-align: center; }
        .footer-mark { font-size: 15px; font-weight: 500; }

        @media (max-width: 700px) {
            .container { padding: 0 22px; }
            .photo-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <header class="site-header" id="site-header">
        <a href="./" class="site-logo-link"><img src="" alt="Libertypictures" class="site-logo" id="site-logo-img" style="display:none;"></a>
    </header>

    <section class="page-hero">
        <div class="container">
            <div class="eyebrow">Portfolio</div>
            <p class="page-intro" id="portfolio-intro" style="display:none;"></p>
        </div>
    </section>

    <div id="portfolio-content" class="container">
        <p class="empty-state">Loading portfolio&hellip;</p>
    </div>

    <section class="cta-band">
        <div class="container">
            <h2 class="serif">Ready for your own session?</h2>
            <p>Choose a package, pick a date, and secure your slot.</p>
            <a href="book.html" class="btn-dark">Book a Session</a>
        </div>
    </section>

    <footer class="brand-footer">
        <span class="serif footer-mark">Libertypictures © 2026</span>
    </footer>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
        <img id="lightbox-img" src="" alt="">
    </div>

<script>
    var API_BASE = 'https://liberty-booking-api.visualsliberty.workers.dev';

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = String(str == null ? '' : str);
        return div.innerHTML;
    }

    // LOGO + INTRO TEXT — real logo and editorial intro from Settings,
    // same source as the Home page. Intro stays hidden if not filled in.
    (function () {
        fetch(API_BASE + '/api/settings')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var s = data.settings || {};
                if (s.logo_url) {
                    var siteLogo = document.getElementById('site-logo-img');
                    siteLogo.src = API_BASE + s.logo_url;
                    siteLogo.style.display = 'block';
                }
                if (s.portfolio_intro) {
                    var introEl = document.getElementById('portfolio-intro');
                    introEl.textContent = s.portfolio_intro;
                    introEl.style.display = 'block';
                }
            })
            .catch(function (err) { console.error('Could not load logo:', err); });
    })();

    // SITE HEADER — no large hero to key off here, so this just goes
    // frosted after a small, real scroll distance instead.
    (function () {
        var header = document.getElementById('site-header');
        window.addEventListener('scroll', function () {
            header.classList.toggle('is-scrolled', window.scrollY > 30);
        }, { passive: true });
    })();

    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightbox-img');
    function openLightbox(url) {
        lightboxImg.src = url;
        lightbox.classList.add('is-open');
    }
    function closeLightbox() {
        lightbox.classList.remove('is-open');
        lightboxImg.src = '';
    }
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });

    (function () {
        var content = document.getElementById('portfolio-content');
        fetch(API_BASE + '/api/portfolio?publishedOnly=true')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var items = data.items || [];
                if (!items.length) {
                    content.innerHTML = '<p class="empty-state">New work is on its way \u2014 check back soon, or <a href="book.html">book a session</a> to be part of it.</p>';
                    return;
                }

                var byCategory = {};
                var order = [];
                items.forEach(function (item) {
                    if (!byCategory[item.category]) { byCategory[item.category] = []; order.push(item.category); }
                    byCategory[item.category].push(item);
                });

                content.innerHTML = order.map(function (category) {
                    var photos = byCategory[category];
                    return '<div class="category-block">' +
                        '<h2 class="category-title">' + escapeHtml(category) + '</h2>' +
                        '<div class="photo-grid">' +
                        photos.map(function (p) {
                            return '<button type="button" class="photo-item" data-url="' + API_BASE + p.imageUrl + '"><img src="' + API_BASE + p.imageUrl + '" alt="' + escapeHtml(category) + '" loading="lazy"></button>';
                        }).join('') +
                        '</div></div>';
                }).join('');

                content.querySelectorAll('.photo-item').forEach(function (btn) {
                    btn.addEventListener('click', function () { openLightbox(btn.dataset.url); });
                });
            })
            .catch(function (err) {
                content.innerHTML = '<p class="empty-state">Couldn\'t load the portfolio right now \u2014 please refresh.</p>';
                console.error('Could not load portfolio:', err);
            });
    })();
</script>

</body></html>
