    <style>
        :root {
            --bg-body: #faf8f4;
            --bg-container: #ffffff;
            --bg-card: #fefdfb;
            --text-primary: #1a1815;
            --text-secondary: #6b6459;
            --accent: #8a7355;
            --accent-deep: #6e5c44;
            --border-color: #e8e3d9;
            --border-dashed: #d8d1c2;
            --btn-primary-bg: #1a1815;
            --btn-primary-text: #ffffff;
            --highlight-bg: #f8f4ec;
            --shadow-subtle: rgba(26,24,21,0.04);
            --shadow-hover: rgba(26,24,21,0.10);
            --shadow-lift: rgba(26,24,21,0.16);
            --logo-filter: invert(0);
            --hero-scrim-rgb: 20,18,16;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 6px;
            /* Surface the film strip lies on. In light mode it's the
               cream page bg; the perforations show cream through. */
            --strip-surface: var(--bg-body);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #161513;
                --bg-container: #1f1e1b;
                --bg-card: #262521;
                --text-primary: #f3f0ea;
                --text-secondary: #a8a196;
                --accent: #c4a67e;
                --accent-deep: #d9bf98;
                --border-color: #35332d;
                --border-dashed: #423f37;
                --btn-primary-bg: #c4a67e;
                --btn-primary-text: #161513;
                --highlight-bg: #24221d;
                --shadow-subtle: rgba(0,0,0,0.24);
                --shadow-hover: rgba(0,0,0,0.42);
                --shadow-lift: rgba(0,0,0,0.55);
                --logo-filter: invert(1);
                --hero-scrim-rgb: 6,6,7;
                /* Behind-the-strip surface. Bumped up enough to give
                   the sprocket holes a proper lift against the near-
                   black film base, while staying dark enough that the
                   top/bottom fade still reads as a black falloff (not
                   the warm-gold halo the earlier value gave us). */
                --strip-surface: #38322b;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }
        .serif { font-family: 'Fraunces', serif; }
        img { max-width: 100%; display: block; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        .container { max-width: 1140px; margin: 0 auto; padding: 0 40px; }
        .section-block { padding: 0; }

        /* SECTION REVEAL — titles write themselves in from left to
           right (clip-path reveal). Content is always visible, never
           fades — no ease-in effect at all. */
        .section-heading {
            font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px;
            letter-spacing: -0.2px; text-align: center; margin-bottom: 28px;
            clip-path: none;
            transition: none;
        }
        .section-heading.is-revealed { clip-path: inset(0 0% 0 0); }

        @media (prefers-reduced-motion: reduce) {
            .section-heading { clip-path: none; transition: none; }
        }
        .async-reveal { display: none; }
        .async-reveal.is-visible { display: block; animation: lp-fade-in-up 0.6s cubic-bezier(0.16,1,0.3,1); }
        @keyframes lp-fade-in-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) {
            .async-reveal.is-visible { animation: lp-fade-in-simple 0.4s ease; }
        }
        @keyframes lp-fade-in-simple { from { opacity: 0; } to { opacity: 1; } }
        .section-meta { font-size: 14.5px; color: var(--text-secondary); text-align: center; max-width: 460px; margin: 0 auto 32px; line-height: 1.75; }
        .experience-section { padding: 180px 0 80px; }
        .book-cta-section { padding: 60px 0 80px; }

        /* GLASS BUTTONS, light-background variant — same frosted
           language as the hero buttons, tuned for legibility over a
           flat cream/dark surface instead of a photograph. No borders
           on either variant, by design. */
        .btn-dark { display: inline-block; background: rgba(26,24,21,0.05); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); color: var(--text-primary); padding: 19px 46px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 2.4px; text-decoration: none; transition: background 0.4s cubic-bezier(0.16,1,0.3,1), color 0.4s cubic-bezier(0.16,1,0.3,1), transform 0.4s cubic-bezier(0.16,1,0.3,1), box-shadow 0.4s cubic-bezier(0.16,1,0.3,1); border: none; cursor: pointer; box-shadow: 0 4px 20px var(--shadow-subtle), inset 0 1px 0 rgba(255,255,255,0.5); }
        /* Secondary action — a plain text link, deliberately with no
           button chrome at all, so "Book a Session" reads as the one
           clear action and this stays visually subordinate to it. */
        .btn-link-secondary { display: inline-block; margin-top: 22px; color: var(--text-secondary); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1.4px; text-decoration: none; border-bottom: 1px solid var(--border-color); padding-bottom: 3px; transition: color 0.3s ease, border-color 0.3s ease; }
        .btn-link-secondary:hover { color: var(--accent); border-color: var(--accent); }
        .btn-dark:hover { background: rgba(138,115,85,0.16); color: var(--accent-deep); transform: translateY(-2px); box-shadow: 0 14px 32px var(--shadow-hover), inset 0 1px 0 rgba(255,255,255,0.6); }
        @media (prefers-color-scheme: dark) {
            .btn-dark { background: rgba(255,255,255,0.06); box-shadow: 0 4px 20px var(--shadow-subtle), inset 0 1px 0 rgba(255,255,255,0.08); }
            .btn-dark:hover { background: rgba(196,166,126,0.18); }
        }

        /* PAGE ENTRANCE — a graceful fade-in rather than an abrupt pop,
           on first load and whenever arriving from another page. */
        body { opacity: 0; animation: lp-page-in 0.3s ease 0.05s forwards; }
        @keyframes lp-page-in { to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { body { animation: none; opacity: 1; } }

        /* SITE HEADER — sits over the hero and scrolls away naturally
           with it, like ordinary page content, rather than staying
           pinned to the viewport. */
        .site-header { position: absolute; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 14px 0; }
        .site-logo-link { display: block; }
        .site-logo { height: 38px; width: auto; filter: brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0,0,0,0.25)); }

        /* HERO — identical mechanics to the booking page: video or
           slideshow, controlled entirely from Settings. */
        .lp-hero { position: relative; height: 92vh; height: 92svh; min-height: 560px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #141210; }
        .lp-hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
        .lp-hero-slideshow { position: absolute; inset: 0; }
        .lp-hero-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 0.9s ease; }
        .lp-hero-slide.is-active { opacity: 1; }
        .lp-hero-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 3; transition: opacity 0.1s ease; }
        .lp-hero-flash.is-flashing { opacity: 0.32; transition: opacity 0.06s ease; }
        .lp-hero-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(var(--hero-scrim-rgb),0.7), rgba(var(--hero-scrim-rgb),0.15) 55%); }
        .lp-hero-content { position: relative; padding: 0 6vw; color: #fff; max-width: 700px; text-align: center; }
        .lp-hero-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: clamp(30px, 5.5vw, 58px); line-height: 1.2; margin-bottom: 20px; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,0.4); }
        .lp-hero-sub { font-size: 14px; color: rgba(255,255,255,0.82); max-width: 380px; margin: 0 auto; line-height: 1.7; }


        /* SCROLL INDICATOR — a full-width frosted glass strip embedded
           into the hero's own bottom edge, as if that edge of the page
           itself were made of glass, rather than a floating element on
           top of it. It sits straddling the boundary; the hero's
           existing overflow:hidden naturally clips its lower half, so
           only the upper sliver (with the chevron) is ever visible. A
           slow breathing opacity pulse keeps it alive without drawing
           attention; it fades away entirely once scrolling begins —
           animation is explicitly cleared when hidden, since a running
           keyframe animation would otherwise keep fighting the fade. */
        .lp-scroll-indicator {
            position: absolute; left: 0; right: 0; bottom: -14px;
            height: 56px;
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: 14px;
            color: #fff;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.22);
            animation: lp-breathe 4s ease-in-out infinite;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        .lp-scroll-indicator.is-hidden { opacity: 0; animation: none; }
        @keyframes lp-breathe {
            0%, 100% { opacity: 0.75; }
            50% { opacity: 1; }
        }

        /* FLOATING BOOK CTA — a flush, edge-to-edge strip of frosted
           glass pinned to the very bottom of the viewport, built with
           the same glass system as the hero's bottom edge (same
           blur/saturate recipe, hairline top highlight, no rounded
           chrome, no side margins): it runs end to end and sits flush
           against the bottom with no gap. A small white chevron arrow
           sits tucked beneath the label, and the whole strip
           highlights when hovered or pressed, so it clearly feels
           tappable. It appears shortly after the visitor scrolls past
           the hero (well before the reviews) and then stays pinned;
           only returning to the very top hides it again. */
        .lp-float-book {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px;
            padding: 9px 24px calc(9px + env(safe-area-inset-bottom, 0px));
            font-size: 10px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 2.4px; text-decoration: none;
            color: #1a1815;
            background: rgba(255,252,248,0.72);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: none; border-top: 1px solid rgba(26,24,21,0.08); border-radius: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 -12px 32px rgba(26,24,21,0.06);
            opacity: 0; transform: translateY(100%); pointer-events: none;
            transition: opacity 0.4s ease, transform 0.55s cubic-bezier(0.16,1,0.3,1), background-color 0.3s ease;
            will-change: transform;
        }
        .lp-float-book-label { line-height: 1.1; }
        .lp-float-book-arrow {
            flex: none; color: #fff;
            filter: drop-shadow(0 1px 1px rgba(26,24,21,0.35));
            transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        .lp-float-book.is-visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .lp-float-book:hover { background: rgba(255,255,255,0.92); }
        .lp-float-book:hover .lp-float-book-arrow { transform: translateY(-2px); }
        .lp-float-book:active { background: rgba(196,166,126,0.16); }
        @media (prefers-color-scheme: dark) {
            .lp-float-book {
                color: #f3f0ea;
                background: rgba(24,22,20,0.76);
                border-top-color: rgba(255,255,255,0.1);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 -12px 32px rgba(0,0,0,0.35);
            }
            .lp-float-book:hover { background: rgba(42,38,34,0.86); }
        }
        @media (max-width: 600px) {
            .lp-float-book { padding: 9px 20px calc(9px + env(safe-area-inset-bottom, 0px)); font-size: 9px; letter-spacing: 1.8px; gap: 3px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .lp-float-book { transition: opacity 0.3s ease; }
            .lp-float-book.is-visible { transform: none; }
            .lp-float-book-arrow { transition: none; }
        }

        /* FEATURED WORK */
        .work-empty { text-align: center; color: var(--text-secondary); font-size: 13.5px; padding: 40px 0; }

        /* SOCIAL PROOF COUNTER — static, no scroll-driven scaling */
        .social-proof { padding: 50px 0 20px; text-align: center; }
        .social-proof-items { display: flex; justify-content: center; gap: 48px; flex-wrap: wrap; }
        .social-proof-item { text-align: center; }
        .social-proof-number {
            font-family: 'Fraunces', serif; font-size: clamp(16px, 2.2vw, 24px); font-weight: 500; line-height: 1.1;
            color: var(--text-primary);
        }
        .social-proof-label { font-size: 8px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-secondary); margin-top: 8px; font-weight: 500; }
        @media (max-width: 600px) { .social-proof-items { gap: 32px; } .social-proof { padding: 40px 0 14px; } }

        /* FEATURED IN */
        .featured-in { padding: 60px 0; text-align: center; }
        .featured-in-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 28px; }
        .featured-in-logos { display: flex; justify-content: center; align-items: center; gap: 40px; flex-wrap: wrap; opacity: 0.5; }
        .featured-in-logos img { height: 28px; width: auto; filter: grayscale(1); transition: filter 0.3s ease, opacity 0.3s ease; }
        .featured-in-logos img:hover { filter: grayscale(0); opacity: 1; }
        /* FEATURED WORK spacing — generous top padding so the scroll
           from Social Proof breathes for a moment before the strip
           appears; hugs Reviews below (that section's atmosphere
           stage does the "breathing scroll" job in the other
           direction). Heading sits right on top of the strip. */
        .work-section { padding-top: 180px; padding-bottom: 24px; }

        /* FEATURED WORK heading — matches the social-proof LABEL
           voice exactly (same font, size, weight, colour), just with
           a touch more letter-spacing to earn its role as a section
           title. Sits close to the strip via a small margin-bottom.
           Overrides the default .section-heading (Fraunces 18px 500)
           only inside this section; the reveal animation still
           applies via the base class. */
        .work-section .section-heading {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 9.5px;
            letter-spacing: 4.5px;
            word-spacing: 8px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }


        /* ABOUT — centered vertical composition: photo, bio, signature.
           No title, no eyebrow, no grid. The signature (Fraunces italic
           at display size) carries the identity instead of a label. */
        .about-wrap { max-width: 520px; margin: 0 auto; text-align: center; }
        .about-photo { width: 240px; margin: 0 auto 24px; overflow: hidden; aspect-ratio: 4/5; background: var(--bg-card); }
        .about-photo img { width: 100%; height: 100%; object-fit: cover; }
        .about-bio { font-size: 13.5px; color: var(--text-secondary); line-height: 1.85; margin-bottom: 20px; max-width: 320px; margin-left: auto; margin-right: auto; text-wrap: balance; white-space: pre-line; }
        #about-section { padding: 140px 0 120px; }


        /* REVIEWS — a full-page editorial installation. The stage
           fills the entire section so background words spread across
           the full viewport, not crammed into a tiny box. The featured
           quote sits dead center at a prominent size. */
        /* Atmosphere zone — a tall breathing panel that sits BEFORE
           the Reviews title. Populated with the same scattered word
           field, so scrolling past Featured Work drifts through
           atmosphere for a while before the "Reviews" heading and
           customer quote arrive on-screen. */
        .voices-atmosphere { position: relative; width: 100%; height: 380px; overflow: hidden; pointer-events: none; }
        /* Stage is now just the space that holds the centered quote —
           no longer needs to be tall since atmosphere lives in its
           own zone above. */
        .voices-stage { position: relative; width: 100%; height: 320px; min-height: 0; }
        /* Small top padding so the Reviews section starts CLOSE to
           Featured Work. The atmosphere zone inside is what actually
           does the "scroll transition". Bottom padding preserved so
           the distance to About Photographer holds. */
        .voices-section { min-height: 0; display: flex; flex-direction: column; padding: 20px 0 0; }
        .voices-section .testimonials-label { font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px; letter-spacing: -0.2px; text-align: center; margin-bottom: 0; }
        .voices-section .testimonials-label.is-revealed { clip-path: inset(0 0% 0 0); }

        /* Background word field — words now spread across the full
           stage (which is the full section height), creating a genuine
           atmosphere rather than a cramped cluster. Each word breathes
           on its own rhythm and has a subtle rotation for organic feel. */
        .voices-word {
            position: absolute; font-family: 'Fraunces', serif; font-style: italic;
            color: var(--text-secondary); opacity: 0.22; white-space: nowrap;
            animation: voices-breathe 8s ease-in-out infinite;
            transition: opacity 1.2s ease;
            transform: rotate(var(--word-rotation, 0deg));
        }
        .voices-section.is-focused .voices-word { opacity: 0.1; }
        @keyframes voices-breathe {
            0%, 100% { transform: translate(0, 0) rotate(var(--word-rotation, 0deg)); }
            50% { transform: translate(2px, -3px) rotate(var(--word-rotation, 0deg)); }
        }

        /* The featured quote — dead center of the full stage at a
           prominent size that befits a full-page presentation. */
        .voices-quote-wrap {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: min(680px, 88%); text-align: center; pointer-events: none;
        }
        .voices-quote {
            font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
            font-size: clamp(19px, 2.8vw, 28px); line-height: 1.7; color: var(--text-primary);
            opacity: 0; filter: blur(6px); transform: translateY(8px);
            transition: opacity 1.3s cubic-bezier(0.22,1,0.36,1), filter 1.3s cubic-bezier(0.22,1,0.36,1), transform 1.3s cubic-bezier(0.22,1,0.36,1);
        }
        .voices-quote.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }
        .voices-name {
            margin-top: 24px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
            color: var(--accent); font-weight: 600;
            opacity: 0; filter: blur(4px); transform: translateY(6px);
            transition: opacity 1s cubic-bezier(0.22,1,0.36,1) 0.4s, filter 1s cubic-bezier(0.22,1,0.36,1) 0.4s, transform 1s cubic-bezier(0.22,1,0.36,1) 0.4s;
        }
        .voices-name.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }
        .voices-stars {
            display: inline-flex; align-items: center; gap: 1px;
            margin-top: 14px; padding: 6px 14px;
            background: rgba(26,24,21,0.05);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border-radius: 20px;
            box-shadow: 0 2px 10px var(--shadow-subtle), inset 0 1px 0 rgba(255,255,255,0.4);
            font-size: 9px; letter-spacing: 2px; color: var(--text-primary);
            opacity: 0; filter: blur(4px); transform: translateY(6px);
            transition: opacity 1s cubic-bezier(0.22,1,0.36,1) 0.55s, filter 1s cubic-bezier(0.22,1,0.36,1) 0.55s, transform 1s cubic-bezier(0.22,1,0.36,1) 0.55s;
        }
        .voices-stars.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }
        @media (prefers-color-scheme: dark) {
            .voices-stars { background: rgba(255,255,255,0.06); box-shadow: 0 2px 10px var(--shadow-subtle), inset 0 1px 0 rgba(255,255,255,0.08); }
        }

        @media (max-width: 700px) {
            .voices-atmosphere { height: 320px; }
            .voices-stage { flex: none; height: 300px; margin: 0 auto; }
            .voices-section { padding: 16px 0 0; }
            #about-section { padding: 90px 0 70px; }
            .voices-quote-wrap { width: 90%; }
            .voices-quote { font-size: clamp(16px, 4.5vw, 20px); }
            .voices-word { display: none; }
            .voices-word.voices-word-mobile { display: block; font-size: 12px !important; }
        }

        /* Reduced motion — the installation becomes a simple, calm
           crossfade; no blur, no drift, no upward settle. */
        @media (prefers-reduced-motion: reduce) {
            .voices-word { animation: none !important; transition: opacity 0.6s ease !important; }
            .voices-quote, .voices-name, .voices-stars { filter: none !important; transform: none !important; transition: opacity 0.6s ease !important; }
        }

        /* THE EXPERIENCE — a quiet, editorial sequence of reassuring
           statements (not a process/steps grid): the emotional bridge
           between Featured Work and Book. No cards, no numbers, no icons —
           generous whitespace between each line lets it read almost
           like a short poem. Each statement fades in independently as
           it's scrolled to, via the same lpRevealOnScroll used
           elsewhere on the page. All text is dashboard-editable. */
        .experience-sequence { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 80px; padding: 0 0 40px; }
        .experience-statement { text-align: center; padding: 0 12px; }
        .experience-statement .statement-text { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: clamp(21px, 3vw, 29px); line-height: 1.55; color: var(--text-primary); }
        .experience-statement .statement-support { margin-top: 14px; font-size: 13.5px; color: var(--text-secondary); line-height: 1.8; }
        .experience-statement.lp-reveal { opacity: 0; transform: translateY(16px); transition: opacity 1.3s cubic-bezier(0.16,1,0.3,1), transform 1.3s cubic-bezier(0.16,1,0.3,1); }
        .experience-statement.lp-reveal.is-in { opacity: 1; transform: translateY(0); }

        .cta-primary-btn:hover { transform: translateY(-3px); box-shadow: 0 18px 40px var(--shadow-lift); background: var(--accent); color: #fff; }
        .cta-primary-btn:active { transform: translateY(0); }
        .book-cta-section a[href="wedding.html"]:hover { color: var(--accent); border-color: var(--accent); }

        /* Extra bottom padding clears the flush book CTA bar when the
           page is scrolled fully to the end. */
        .brand-footer { padding: 60px 0 calc(92px + env(safe-area-inset-bottom, 0px)); text-align: center; border-top: 1px solid var(--border-color); }
        .footer-mark { font-size: 15px; font-weight: 500; letter-spacing: 0.3px; }
        .footer-contact { margin-top: 14px; font-size: 12.5px; color: var(--text-secondary); }
        .footer-contact a { color: var(--text-secondary); text-decoration: none; transition: color 0.3s ease; }
        .footer-contact a:hover { color: var(--accent); }
        .footer-contact-divider { margin: 0 10px; opacity: 0.5; }

        /* FEATURED WORK PRESENTATION — one large main photo with a
           perforated film-strip of thumbnails along the edge, at every
           screen size. Tapping a thumbnail crossfades the main photo
           to it. Previously desktop showed a separate editorial grid;
           that's retired in favor of one consistent presentation. */
        .work-mobile-feature {
            display: flex; gap: 0; aspect-ratio: 2.5/3.3; overflow: hidden; position: relative;
            margin-bottom: 0;
            /* The strip sits on this surface. Cream in light mode,
               warm-dark in dark mode — this is what shows through
               the perforations, so it must stay legibly different
               from the film base at every viewer's theme. */
            background: var(--strip-surface);
            box-shadow: 0 24px 60px var(--shadow-hover), 0 8px 32px rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        .work-mobile-feature.is-empty { aspect-ratio: auto; display: block; overflow: visible; background: none; }

        .work-main-photo { flex: 1; position: relative; overflow: hidden; min-width: 0; }
        .work-photo-counter {
            text-align: center; padding: 8px 0 0; z-index: 5; position: absolute; top: 0; left: 0; right: 0;
            color: #c4a67e; font-family: 'Share Tech Mono', monospace; font-size: 7px; font-weight: 400; letter-spacing: 1.5px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, transparent 100%);
            pointer-events: none;
        }
        .work-main-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease; }
        .work-main-photo img.is-active { opacity: 1; animation: lp-ken-burns 16s ease-out forwards; }
        @keyframes lp-ken-burns { from { transform: scale(1); } to { transform: scale(1.02); } }
        @media (prefers-reduced-motion: reduce) {
            .work-main-photo img.is-active { animation: none; }
        }
        .work-strip-wrap {
            width: 22%; position: relative; overflow-y: auto; overflow-x: hidden;
            scroll-behavior: smooth; scrollbar-width: none; min-height: 0;
            overscroll-behavior-y: contain;
            background: transparent;
            /* Single soft drop shadow — less "gritty" edge, more like
               a natural film-on-surface shadow. */
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.32));
            /* Very light fade at the top/bottom edges. Multi-stop
               easing (not a single linear ramp) so the fade curve reads
               smoothly instead of a hard transparent-to-opaque line at
               2.5%. Same TOTAL fade area — just distributed over more
               steps so the eye doesn't catch the seam. */
            -webkit-mask-image: linear-gradient(to bottom,
                transparent 0%,
                rgba(0,0,0,0.08) 0.4%,
                rgba(0,0,0,0.25) 0.9%,
                rgba(0,0,0,0.5) 1.4%,
                rgba(0,0,0,0.78) 1.9%,
                black 2.5%,
                black 97.5%,
                rgba(0,0,0,0.78) 98.1%,
                rgba(0,0,0,0.5) 98.6%,
                rgba(0,0,0,0.25) 99.1%,
                rgba(0,0,0,0.08) 99.6%,
                transparent 100%);
            mask-image: linear-gradient(to bottom,
                transparent 0%,
                rgba(0,0,0,0.08) 0.4%,
                rgba(0,0,0,0.25) 0.9%,
                rgba(0,0,0,0.5) 1.4%,
                rgba(0,0,0,0.78) 1.9%,
                black 2.5%,
                black 97.5%,
                rgba(0,0,0,0.78) 98.1%,
                rgba(0,0,0,0.5) 98.6%,
                rgba(0,0,0,0.25) 99.1%,
                rgba(0,0,0,0.08) 99.6%,
                transparent 100%);
        }
        .work-strip-wrap::-webkit-scrollbar { display: none; }

        /* Film strip — each thumbnail is one 35mm frame tile with its
           own SVG background (crisp per-tile rasterization keeps the
           sprocket cutouts sharp; a single repeat-y background on the
           track blurred them). Adjacent tiles overlap by 3px via
           negative margin so sub-pixel rounding at the tile boundary
           can never leak the cream surface through as a horizontal
           cut. The overlap lives entirely inside the solid film area
           — perforations start 40px from a tile's top and end 24px
           from its bottom, so a 3px overlap cannot touch any sprocket
           hole. Rhythm across tiles is preserved. */
        .work-strip-track {
            display: flex; flex-direction: column;
            position: relative; gap: 0;
            background: none;
        }
        .work-strip-thumb {
            position: relative; width: 100%; aspect-ratio: 400 / 560;
            border: none; padding: 0; cursor: pointer; display: block;
            background-color: transparent;
            background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 560' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='fb' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%230a0805'/%3E%3Cstop offset='0.5' stop-color='%2316100a'/%3E%3Cstop offset='1' stop-color='%230a0805'/%3E%3C/linearGradient%3E%3ClinearGradient id='fw' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23050403'/%3E%3Cstop offset='1' stop-color='%23070604'/%3E%3C/linearGradient%3E%3Cmask id='m'%3E%3Crect x='0' y='0' width='400' height='560' fill='white'/%3E%3Crect x='16' y='40' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='16' y='120' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='16' y='200' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='16' y='280' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='16' y='360' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='16' y='440' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='16' y='520' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='362' y='40' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='362' y='120' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='362' y='200' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='362' y='280' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='362' y='360' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='362' y='440' width='22' height='16' rx='2' fill='black'/%3E%3Crect x='362' y='520' width='22' height='16' rx='2' fill='black'/%3E%3C/mask%3E%3C/defs%3E%3Crect x='0' y='0' width='400' height='560' fill='url(%23fb)' mask='url(%23m)'/%3E%3Crect x='70' y='15' width='260' height='530' fill='url(%23fw)'/%3E%3C/svg%3E");
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }
        /* Adjacent tiles overlap by 3px so fractional-pixel rounding
           of each tile's height cannot leave a cream-colored hairline
           between them. 3px sits well inside the 40px top / 24px
           bottom solid-film buffer, so no sprocket hole is ever
           overlapped. */
        .work-strip-thumb + .work-strip-thumb { margin-top: -3px; }
        /* Photo overlay — inside the frame window (70/400 → 330/400,
           15/560 → 545/560). Negative-film treatment back on: colour
           inversion + hue rotate so photos read as un-developed film,
           the same look you liked earlier. */
        .work-strip-thumb img {
            position: absolute;
            left: 17.5%;      /* 70 / 400 */
            top: 2.68%;       /* 15 / 560 */
            width: 65%;       /* 260 / 400 */
            height: 94.64%;   /* 530 / 560 */
            object-fit: cover;
            /* Softer negative: inversion + warm orange cast from sepia
               & hue-rotate (Kodak-negative base tone), lowered
               saturation and contrast so it doesn't feel neon. */
            filter: invert(1) sepia(0.45) hue-rotate(-25deg) saturate(0.42) brightness(0.88) contrast(0.95);
            opacity: 0.5;
            transition: filter 0.3s ease, opacity 0.25s ease;
        }
        /* Hover / active — brighten enough to preview */
        .work-strip-thumb:hover img { opacity: 0.62; filter: invert(1) sepia(0.4) hue-rotate(-22deg) saturate(0.5) brightness(0.92) contrast(0.96); }
        .work-strip-thumb.is-active img { opacity: 0.62; filter: invert(1) sepia(0.4) hue-rotate(-22deg) saturate(0.5) brightness(0.92) contrast(0.96); }
        /* Landscape frames — same fix as the gallery film rail: a
           landscape photo is rotated 90° inside its frame window
           instead of being cropped. The box maths mirror the rail:
           132.5% × 46.43% centred on the window, turned sideways. */
        .work-strip-thumb.is-landscape img {
            left: -16.25%;
            top: 26.79%;
            width: 132.5%;
            height: 46.43%;
            max-width: none;
            transform: rotate(90deg);
        }
        /* Active highlight sits on the FRAME WINDOW only, never on the
           outer film/sprocket columns. Colour matches the frame-number
           gold so the whole edge-marking language reads as one system. */
        .work-strip-thumb.is-active::after {
            content: ''; position: absolute; pointer-events: none;
            left: 17.5%; top: 2.68%; width: 65%; height: 94.64%;
            box-shadow: inset 0 0 0 1.5px #d4a030;
            z-index: 4;
        }

        /* Frame number & brand text — both run VERTICALLY along the
           strip's length, matching the real Kodak/Agfa reference. The
           frame number lives in the narrow film column BETWEEN the
           right sprocket holes and the frame window; brand text does
           the same on the left. Rotated -90° so they read from bottom
           to top like real film edge printing. */
        .work-strip-thumb .frame-num,
        .work-strip-thumb .brand-text {
            position: absolute;
            top: 50%;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-weight: 700;
            color: #d4a030;
            text-shadow: 0 1px 2px rgba(0,0,0,0.85);
            pointer-events: none; line-height: 1; z-index: 3;
            white-space: nowrap;
        }
        .work-strip-thumb .frame-num {
            /* Sits at ~11% from right — safely OUTSIDE the right sprocket
               column (which lives around 84%–88%). Text is short (e.g.
               "▶ 3") so rotated width stays inside the film area. */
            right: 11%;
            transform: translate(50%, -50%) rotate(-90deg);
            transform-origin: center;
            font-size: 5.5px; letter-spacing: 0.3px;
        }
        .work-strip-thumb .frame-num::before {
            content: '▶ '; opacity: 0.9;
        }
        .work-strip-thumb .brand-text {
            /* Same treatment on the left, in the film gap between the
               sprocket column and the frame window. Very small font so
               the rotated word feels like real film-stock edge print. */
            left: 13%;
            transform: translate(-50%, -50%) rotate(-90deg);
            transform-origin: center;
            font-size: 4px; letter-spacing: 1.2px;
            text-transform: uppercase;
        }
        /* Wider screens get a shorter, more landscape main photo (the
           mobile portrait ratio would otherwise stretch absurdly tall
           across a ~1000px container) and a slightly wider strip so
           the film's edge printing stays legible. */
        @media (min-width: 900px) {
            .work-mobile-feature { aspect-ratio: 16/9; }
            .work-strip-wrap { width: 14%; }
        }


        @media (max-width: 900px) {
            .about-wrap { max-width: 360px; }
            .about-photo { width: 200px; }
            .about-bio { max-width: 280px; }
            .experience-sequence { gap: 56px; }
        }
        /* Digital camera font for photo counter */
        @media (max-width: 600px) {
            .container { padding: 0 22px; }
            .section-block { padding: 70px 0; }
            .experience-section { padding-top: 130px; }
            .work-section { padding-top: 130px; padding-bottom: 16px; }
            .lp-hero { height: 100vh; height: 100svh; }
            .section-heading { font-size: 16px; }
            .lp-hero-title { font-size: clamp(26px, 8vw, 34px); }
            .lp-hero-sub { font-size: clamp(9.5px, 3.1vw, 12px); white-space: nowrap; max-width: none; }
        }
    </style>
</head>
<body>

<script>
    var API_BASE = 'https://liberty-booking-api.visualsliberty.workers.dev';

    // Fetched once, shared by every section that needs Settings data
    // (Hero, Logo, About, Experience) — previously each fetched
    // /api/settings independently, doubling that request for no
    // reason since it's the exact same data every time.
    var settingsPromise = fetch(API_BASE + '/api/settings').then(function (res) { return res.json(); });

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = String(str == null ? '' : str);
        return div.innerHTML;
    }

    // Reveals an `.async-reveal` element with a GPU-only fade (opacity +
    // transform via a CSS keyframe animation, triggered by the display
    // switch) instead of animating a layout property like max-height —
    // layout properties force a reflow on every frame of the animation,
    // which stutters if it happens to run while the visitor is actively
    // scrolling. Used for sections whose content only exists after an
    // API fetch resolves (About, Voices).
    function lpRevealSmoothly(el) {
        if (!el) return;
        el.classList.add('is-visible');
    }

    // Simple one-time scroll reveal — fades/slides each element in the
    // moment it scrolls into view, staggered by index for a gentle
    // cascade. `.lp-reveal` alone (before this runs) is a no-op, so
    // content stays visible if JS fails.
    function lpRevealOnScroll(elements, minGap) {
        if (!('IntersectionObserver' in window)) return;
        var els = Array.prototype.slice.call(elements);
        if (!els.length) return;
        els.forEach(function (el) { el.classList.add('lp-reveal'); });

        var pendingHides = new WeakMap();
        // Tracks the earliest time the NEXT reveal is allowed to start.
        // A reveal triggered well after this (normal/slow scrolling)
        // gets zero delay — instant, tied directly to scroll position,
        // not to a timer. Only when a reveal is triggered before this
        // (several elements crossing into view within the same instant,
        // i.e. a fast scroll) does it get pushed out by minGap from the
        // previous one, so it still reads as sequential instead of all
        // popping in together.
        var nextRevealNotBefore = 0;

        // No "already visible, skip the animation" shortcut here.
        // IntersectionObserver always fires immediately upon observe()
        // with whatever's currently true, so anything on-screen the
        // moment observation starts still gets a real, correct entrance
        // through the exact same path below — never a silent skip.
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                var el = entry.target;
                if (entry.isIntersecting) {
                    var pendingHide = pendingHides.get(el);
                    if (pendingHide) { clearTimeout(pendingHide); pendingHides.delete(el); }
                    if (el.classList.contains('is-in')) return;

                    var now = Date.now();
                    var delay = Math.max(0, nextRevealNotBefore - now);
                    nextRevealNotBefore = now + delay + (minGap || 0);
                    el.style.transitionDelay = delay + 'ms';
                    el.classList.add('is-in');
                } else {
                    if (!el.classList.contains('is-in') || pendingHides.has(el)) return;
                    var hideTimer = setTimeout(function () {
                        pendingHides.delete(el);
                        el.style.transitionDelay = '0ms';
                        el.classList.remove('is-in');
                    }, 400);
                    pendingHides.set(el, hideTimer);
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -25% 0px' });
        els.forEach(function (el) { observer.observe(el); });
    }

    // CTA SECTION — a single dominant "View Packages" button (the whole
    // SECTION TITLES — every Home page heading is editable from the
    // admin's Section Titles page (one place for all of them). A title
    // saved as blank hides that heading entirely. A title that was
    // never saved keeps the default baked into the markup, so the
    // headings only disappear when the studio deliberately clears
    // them and saves.
    (function () {
        settingsPromise.then(function (data) {
            var s = data.settings || {};
            var titles = {
                'featured-work-title': s.featured_work_title,
                'reviews-title': s.reviews_title,
                'about-title': s.about_title,
                'experience-title': s.experience_title
            };
            Object.keys(titles).forEach(function (id) {
                var el = document.getElementById(id);
                if (!el) return;
                var value = titles[id];
                if (value == null) return; // never saved — keep the default
                if (String(value).trim()) {
                    el.textContent = value;
                } else {
                    el.style.display = 'none';
                }
            });
        });
    })();

    // page is the studio home, so the visitor's already picked studio;
    // don't force them to re-choose). The wedding path stays available
    // as a tiny secondary line for anyone who came in the wrong door.
    (function () {
        settingsPromise.then(function (data) {

    // SOCIAL PROOF — defaults are hardcoded in the HTML (500+, 4, 90%).

    // HERO — identical logic to the booking page: two separate render
    // paths based on hero_mode, never mixing video and slideshow.
    (function () {
        function renderVideo(s) {
            if (!s.hero_video_url) return;
            var oldVideo = document.getElementById('lp-hero-video');
            var newVideo = oldVideo.cloneNode(false);
            newVideo.muted = true;
            newVideo.innerHTML = '<source src="' + API_BASE + s.hero_video_url + '" type="video/mp4">';
            oldVideo.parentNode.replaceChild(newVideo, oldVideo);
            newVideo.play().catch(function (err) { console.error('Hero video could not autoplay:', err.message); });
        }
        function renderSlideshow() {
            document.getElementById('lp-hero-video').style.display = 'none';
            var container = document.getElementById('lp-hero-slideshow');
            var flash = document.getElementById('lp-hero-flash');
            fetch(API_BASE + '/api/hero-images')
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    var images = data.images || [];
                    if (!images.length) return;
                    container.style.display = 'block';
                    // Only the first slide's image is requested at load.
                    // The rest download one-ahead as the show advances, so
                    // a full hero never pulls every full-res photo down at
                    // once (13 images = several MB of transfers the
                    // visitor may never see).
                    container.innerHTML = images.map(function (img, i) {
                        var bg = i === 0 ? ' background-image:url(' + API_BASE + img.imageUrl + ')' : '';
                        return '<div class="lp-hero-slide' + (i === 0 ? ' is-active' : '') + '" data-bg="' + API_BASE + img.imageUrl + '" style="' + bg + '"></div>';
                    }).join('');
                    if (images.length < 2) return;
                    var slides = container.querySelectorAll('.lp-hero-slide');
                    var current = 0;
                    function activate(next) {
                        // This slide's image was preloaded during the
                        // previous cycle — reveal it now.
                        if (slides[next].dataset.bg) {
                            slides[next].style.backgroundImage = 'url(' + slides[next].dataset.bg + ')';
                            delete slides[next].dataset.bg;
                        }
                        // Start downloading the slide after next so the
                        // following crossfade is never a blank frame.
                        var following = slides[(next + 1) % slides.length];
                        if (following && following.dataset.bg) {
                            var warm = new Image();
                            warm.src = following.dataset.bg;
                        }
                        flash.classList.add('is-flashing');
                        setTimeout(function () { flash.classList.remove('is-flashing'); }, 90);
                        slides[current].classList.remove('is-active');
                        slides[next].classList.add('is-active');
                        current = next;
                    }
                    // Preload slide 2 up front, and only start rotating
                    // once it has actually arrived — the first crossfade
                    // must never fade in an empty frame.
                    var second = slides[1];
                    var secondWarm = new Image();
                    var started = false;
                    function startRotating() {
                        if (started) return;
                        started = true;
                        setInterval(function () { activate((current + 1) % slides.length); }, 2000);
                    }
                    if (second && second.dataset.bg) secondWarm.src = second.dataset.bg;
                    if (secondWarm.complete) startRotating();
                    else {
                        secondWarm.onload = startRotating;
                        secondWarm.onerror = startRotating;
                    }
                })
                .catch(function (err) { console.error('Could not load hero slideshow:', err); });
        }

        settingsPromise
            .then(function (data) {
                var s = data.settings || {};
                if (s.hero_mode === 'slideshow') { renderSlideshow(); } else { renderVideo(s); }

                if (s.logo_url) {
                    var siteLogo = document.getElementById('site-logo-img');
                    siteLogo.src = API_BASE + s.logo_url;
                    siteLogo.style.display = 'block';
                }

                // ABOUT — only shown once real content exists in Settings,
                // never with placeholder/fabricated text. Smooth reveal
                // (not an instant display swap) so a late-arriving fetch
                // never causes a sudden layout jump if it resolves while
                // the visitor is already scrolling past this point.
                if (s.about_photo_url && s.about_bio) {
                    document.getElementById('about-photo-img').src = API_BASE + s.about_photo_url;
                    document.getElementById('about-bio-text').textContent = s.about_bio;
                    lpRevealSmoothly(document.getElementById('about-section'));
                }
            })
            .catch(function (err) { console.error('Could not load settings:', err); });
    })();

    // SCROLL INDICATOR — fades away the moment the visitor actually
    // starts scrolling; its job is done at that point.
    (function () {
        var indicator = document.querySelector('.lp-scroll-indicator');
        if (!indicator) return;

            indicator.classList.toggle('is-hidden', window.scrollY > 12);
        }, { passive: true });
    })();

    // FEATURED WORK — pulled from its own, separately-curated photo set
    // (not Portfolio). Builds the main-photo + film-strip presentation
    // used at every screen size.
    (function () {
        var mobileFeature = document.getElementById('work-mobile-feature');
        if (!mobileFeature) return;

        fetch(API_BASE + '/api/featured-work')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var items = data.items || [];
                if (!items.length) {
                    mobileFeature.classList.add('is-empty');
                    mobileFeature.innerHTML = '<p class="work-empty">New work coming soon.</p>';
                    return;
                }
                buildMobileFeature(items);
            })
            .catch(function () {
                mobileFeature.classList.add('is-empty');
                mobileFeature.innerHTML = '<p class="work-empty">Couldn\'t load work right now.</p>';
            });

        function buildMobileFeature(sample) {
            // A single photo doesn't need a strip — just show it plainly
            // rather than showing nothing (the old behavior here).
            if (sample.length < 2) {
                mobileFeature.innerHTML = '<div class="work-main-photo"><img src="' + API_BASE + sample[0].imageUrl + '" alt="Featured work" class="is-active" fetchpriority="high" decoding="async"></div>';
                return;
            }

            // Counter width matches the total length so "01 / 100" stays
            // 3+3 aligned once you go past 99 frames.
            var totalStr = String(sample.length);
            var counterWidth = totalStr.length;
            function frameLabel(i) { return String(i + 1).padStart(counterWidth, '0') + ' / ' + totalStr; }

            // Thumbnails: only the first few load eagerly; the rest are
            // deferred until they scroll into the strip's viewport (via
            // IntersectionObserver, wired up after render). This keeps
            // total-of-N-photos independent of what actually downloads on
            // page load — matters most on mobile data + long strips.
            var EAGER_THUMBS = 4;
            // Brand text pattern — LIBERTY PORTRA / LP PORTRA scattered
            // deterministically so it feels like real film-stock printing
            // (repeats but doesn't appear on every frame) and stays stable
            // across page loads (same photo → same tag).
            var BRAND_PATTERN = [null, 'LIBERTY PORTRA', null, 'LIBERTYPICTURES', null, null, 'LIBERTY PORTRA', null, 'LIBERTYPICTURES', null, 'LIBERTY PORTRA', null];
            var thumbsHtml = sample.map(function (item, i) {
                var url = API_BASE + (item.thumbUrl || item.imageUrl);
                var srcAttr = i < EAGER_THUMBS
                    ? 'src="' + url + '" loading="lazy"'
                    : 'data-src="' + url + '"';
                var brand = BRAND_PATTERN[i % BRAND_PATTERN.length];
                var brandHtml = brand ? '<span class="brand-text">' + brand + '</span>' : '';
                return '<button type="button" class="work-strip-thumb' + (i === 0 ? ' is-active' : '') + '" data-index="' + i + '" aria-label="View photo ' + (i + 1) + ' of ' + sample.length + '"><img ' + srcAttr + ' alt="" fetchpriority="low" decoding="async"><span class="frame-num">' + (i + 1) + '</span>' + brandHtml + '</button>';
            }).join('');

            // Main viewer: eager-load only the first (visible) photo. All
            // others get a data-src and load the moment they're activated,
            // plus a pre-warm of the immediate neighbors so click→appear
            // feels instant. This is the difference between downloading 1
            // full-res image on page load vs. all N — the reason the strip
            // was slow to become interactive.
            // No full-res photo starts downloading at page load — even the
            // first one. The featured section sits below the hero, and
            // these originals are several MB each; loading them early
            // steals bandwidth from the hero (the LCP). The observer
            // below kicks off the first photo + neighbors only as the
            // section approaches the viewport.
            var mainHtml = sample.map(function (item, i) {
                var isFirst = i === 0;
                return '<img data-src="' + API_BASE + item.imageUrl + '" alt="Featured work" class="' + (isFirst ? 'is-active' : '') + '" data-index="' + i + '" decoding="async">';
            }).join('');

            mobileFeature.innerHTML =
                '<div class="work-main-photo">' +
                    '<div class="work-photo-counter" id="work-photo-counter">' + frameLabel(0) + '</div>' +
                    mainHtml +
                '</div>' +
                '<div class="work-strip-wrap" id="work-strip-wrap">' +
                    '<div class="work-strip-track">' + thumbsHtml + '</div>' +
                '</div>';

            var mainImgs = mobileFeature.querySelectorAll('.work-main-photo img');
            var stripWrap = document.getElementById('work-strip-wrap');
            var thumbs = mobileFeature.querySelectorAll('.work-strip-thumb');
            var photoCounter = document.getElementById('work-photo-counter');

            function ensureLoaded(idx) {
                var img = mainImgs[idx];
                if (img && !img.src && img.dataset.src) img.src = img.dataset.src;
            }

            // Deferred thumbnails: load as they scroll into the strip.
            // rootMargin gives ~200px of preload so the swap happens
            // before the user visually reaches the thumb.
            var pendingThumbs = mobileFeature.querySelectorAll('.work-strip-thumb img[data-src]');
            if (pendingThumbs.length && 'IntersectionObserver' in window) {
                var thumbObserver = new IntersectionObserver(function (entries) {
                    entries.forEach(function (e) {
                        if (!e.isIntersecting) return;
                        var img = e.target;
                        if (img.dataset.src) { img.src = img.dataset.src; delete img.dataset.src; }
                        thumbObserver.unobserve(img);
                    });
                }, { root: stripWrap, rootMargin: '200px 0px 200px 0px' });
                pendingThumbs.forEach(function (img) { thumbObserver.observe(img); });
            } else if (pendingThumbs.length) {
                pendingThumbs.forEach(function (img) { img.src = img.dataset.src; delete img.dataset.src; });
            }
            // Full-res photos download only as the section comes into
            // view: the first frame plus both neighbors, so the first
            // click in either direction is still instant. Until then the
            // thumbnails above are the only images this section pulls.
            function primeViewer() {
                ensureLoaded(0);
                if (sample.length > 1) ensureLoaded(1);
                if (sample.length > 2) ensureLoaded(sample.length - 1);
            }
            if ('IntersectionObserver' in window) {
                var primeObserver = new IntersectionObserver(function (entries) {
                    entries.forEach(function (e) {
                        if (!e.isIntersecting) return;
                        primeViewer();
                        primeObserver.disconnect();
                    });
                }, { rootMargin: '600px 0px' });
                primeObserver.observe(mobileFeature);
            } else {
                primeViewer();
            }

            // Landscape frames — same behaviour as the gallery film rail:
            // check each thumbnail's real dimensions once it has loaded and
            // rotate the landscape ones 90° inside their frame. (Covers
            // images that load eagerly, lazily via the observer, or on tap.)
            function orientLandscapeThumb(btn) {
                var img = btn.querySelector('img');
                if (!img) return;
                var apply = function () {
                    if (img.naturalWidth > img.naturalHeight) btn.classList.add('is-landscape');
                };
                if (img.complete) apply();
                else img.addEventListener('load', apply);
            }
            thumbs.forEach(orientLandscapeThumb);

            thumbs.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var idx = btn.dataset.index;
                    var idxNum = parseInt(idx, 10);
                    ensureLoaded(idxNum);
                    ensureLoaded((idxNum + 1) % sample.length);
                    ensureLoaded((idxNum - 1 + sample.length) % sample.length);
                    // If the clicked thumbnail hasn't loaded yet, load it
                    // now — otherwise it stays blank while the main photo
                    // updates.
                    var btnImg = btn.querySelector('img');
                    if (btnImg && btnImg.dataset.src) { btnImg.src = btnImg.dataset.src; delete btnImg.dataset.src; }
                    mainImgs.forEach(function (img) { img.classList.toggle('is-active', img.dataset.index === idx); });
                    photoCounter.textContent = frameLabel(idxNum);
                    thumbs.forEach(function (t) { t.classList.toggle('is-active', t.dataset.index === idx); });

                    // Smooth scroll to center the clicked thumbnail —
                    // like advancing the film strip to the next frame.
                    var thumbHeight = btn.offsetHeight;
                    var scrollTarget = btn.offsetTop - (stripWrap.clientHeight / 2) + (thumbHeight / 2);
                    stripWrap.scrollTo({ top: scrollTarget, behavior: 'smooth' });
                });
            });
        }
    })();

    // VOICES — an editorial installation, not a review carousel.
    // A scattered field of atmosphere words sits in the background;
    // real reviews surface into focus one at a time — reveal,
    // hold, dissolve — and the field softens while one is showing.
    // Pauses entirely when off-screen or under prefers-reduced-motion.
    (function () {
        var stage = document.getElementById('voices-stage');
        var section = document.getElementById('testimonials-section');
        var items = [];
        var lastIndex = -1;
        var running = false;
        var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var timers = [];

        // Purely decorative atmosphere — generic words evoking the
        // feeling of a session, not quotes attributed to any specific
        // client (real reviews only ever come from the API below).
        var ATMOSPHERE_WORDS = ['beautiful', 'effortless', 'authentic', 'unforgettable', 'comfortable', 'timeless', 'gorgeous', 'natural', 'confident', 'seen', 'gentle', 'genuine', 'warm', 'alive', 'graceful'];

        // Hand-placed, deliberately not gridded — a curated scatter
        // rather than a random one. Kept clear of the dead-center zone
        // where the featured quote sits.
        var SLOTS = [
            { x: 5, y: 6 }, { x: 88, y: 4 }, { x: 12, y: 85 }, { x: 90, y: 88 },
            { x: 2, y: 38 }, { x: 94, y: 35 }, { x: 20, y: 15 }, { x: 72, y: 92 },
            { x: 6, y: 68 }, { x: 82, y: 18 }, { x: 38, y: 3 }, { x: 58, y: 96 },
            { x: 25, y: 95 }, { x: 68, y: 6 },
        ];

        function buildWordField() {
            var isMobile = window.innerWidth <= 700;
            var MOBILE_POSITIONS = [
                { x: 4, y: 5 }, { x: 82, y: 3 },
                { x: 2, y: 82 }, { x: 85, y: 85 },
                { x: 6, y: 40 }, { x: 88, y: 38 },
                { x: 35, y: 2 },
            ];
            var MOBILE_SLOT_INDEXES = [0, 2, 4, 6, 8, 9, 12];
            var html = SLOTS.map(function (slot, i) {
                var word = ATMOSPHERE_WORDS[i % ATMOSPHERE_WORDS.length];
                var size = 13 + (i % 4) * 3;
                var delay = (i * 0.5).toFixed(2);
                var rotation = ((i % 5) - 2) * 1.8;
                var isMobileWord = MOBILE_SLOT_INDEXES.indexOf(i) !== -1;
                var mobileClass = isMobileWord ? ' voices-word-mobile' : '';
                var mobilePos = isMobileWord ? MOBILE_POSITIONS[MOBILE_SLOT_INDEXES.indexOf(i)] : null;
                var useX = (isMobile && mobilePos) ? mobilePos.x : slot.x;
                var useY = (isMobile && mobilePos) ? mobilePos.y : slot.y;
                return '<span class="voices-word' + mobileClass + '" style="left:' + useX + '%; top:' + useY + '%; font-size:' + size + 'px; animation-delay:' + delay + 's; --word-rotation:' + rotation + 'deg;">' + word + '</span>';
            }).join('');
            // Atmosphere words live in the dedicated .voices-atmosphere
            // panel that sits BEFORE the Reviews title — so scrolling
            // past Featured Work drifts through the word field first,
            // and the "Reviews" heading + quote arrive further down.
            var atmosphere = document.getElementById('voices-atmosphere');
            (atmosphere || stage).insertAdjacentHTML('afterbegin', html);
        }

        function clearTimers() { timers.forEach(clearTimeout); timers = []; }
        function after(ms, fn) { var t = setTimeout(fn, ms); timers.push(t); return t; }

        var shuffledQueue = [];

        function pickNext() {
            if (!items.length) return 0;
            if (!shuffledQueue.length) {
                // Reshuffle all reviews into a new queue
                shuffledQueue = items.map(function (_, i) { return i; });
                // Fisher-Yates shuffle
                for (var i = shuffledQueue.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = shuffledQueue[i];
                    shuffledQueue[i] = shuffledQueue[j];
                    shuffledQueue[j] = temp;
                }
                // If the first item in the new shuffle is the same as
                // the last one shown, swap it further in so we never
                // see the same review twice in a row at the seam
                if (shuffledQueue.length > 1 && shuffledQueue[0] === lastIndex) {
                    var swapWith = 1 + Math.floor(Math.random() * (shuffledQueue.length - 1));
                    shuffledQueue[0] = shuffledQueue[swapWith];
                    shuffledQueue[swapWith] = lastIndex;
                }
            }
            lastIndex = shuffledQueue.shift();
            return lastIndex;
        }

        function starsHtml(rating) {
            var filled = Math.max(0, Math.min(5, Math.round(rating || 0)));
            var out = '';
            for (var i = 1; i <= 5; i++) out += (i <= filled ? '★' : '☆');
            return out;
        }

        function runCycle() {
            if (!running) return;
            var t = items[pickNext()];

            var quoteEl = document.getElementById('voices-quote');
            var nameEl = document.getElementById('voices-name');
            var starsEl = document.getElementById('voices-stars');
            quoteEl.textContent = t.quote;
            nameEl.textContent = t.clientName;
            starsEl.textContent = starsHtml(t.rating);

            section.classList.add('is-focused');
            // A frame of delay before adding is-visible so the browser
            // registers the text change first — otherwise the reveal
            // transition can be skipped entirely on some browsers.
            after(reducedMotion ? 30 : 60, function () {
                quoteEl.classList.add('is-visible');
                nameEl.classList.add('is-visible');
                starsEl.classList.add('is-visible');
            });

            var holdFor = reducedMotion ? 2000 : 3200;
            var revealTime = reducedMotion ? 400 : 1300;
            var dissolveTime = reducedMotion ? 400 : 1200;

            after(revealTime + holdFor, function () {
                quoteEl.classList.remove('is-visible');
                nameEl.classList.remove('is-visible');
                starsEl.classList.remove('is-visible');
                section.classList.remove('is-focused');
            });

            after(revealTime + holdFor + dissolveTime + 900, runCycle);
        }

        function start() {
            if (running) return;
            running = true;
            runCycle();
        }
        function stop() {
            running = false;
            clearTimers();
        }

        fetch(API_BASE + '/api/testimonials?publishedOnly=true')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                items = data.testimonials || [];
                if (!items.length) return;

                buildWordField();
                stage.insertAdjacentHTML('beforeend',
                    '<div class="voices-quote-wrap">' +
                        '<p class="voices-quote" id="voices-quote"></p>' +
                        '<div class="voices-name" id="voices-name"></div>' +
                        '<div class="voices-stars" id="voices-stars" aria-hidden="true"></div>' +
                    '</div>'
                );

                lpRevealSmoothly(section);

                if ('IntersectionObserver' in window) {
                    var observer = new IntersectionObserver(function (entries) {
                        entries.forEach(function (entry) {
                            if (entry.isIntersecting) start(); else stop();
                        });
                    }, { threshold: 0.2 });
                    observer.observe(section);
                } else {
                    start();
                }
            })
            .catch(function (err) { console.error('Could not load Voices content:', err); });
    })();

    // THE EXPERIENCE — a quiet, editorial sequence of reassuring
    // statements, pulled entirely from Settings (dashboard-editable).
    // Stays hidden if nothing's been saved yet, same honesty rule as
    // About and Testimonials — never shows placeholder text. Staggered
    // reveal (not simultaneous) so it always reads as one statement
    // delivered at a time, even on a fast scroll that brings several
    // into view within the same instant — lpRevealOnScroll assigns
    // each element's delay by its fixed position in the sequence, so
    // they stay visually sequential regardless of how quickly they're
    // all technically "in view" together.
    (function () {
        var sequenceEl = document.getElementById('experience-sequence');

        settingsPromise
            .then(function (data) {
                var s = data.settings || {};
                if (!s.experience_statements_json) return;

                var statements;
                try { statements = JSON.parse(s.experience_statements_json); } catch (e) { return; }
                if (!Array.isArray(statements) || !statements.length) return;

                sequenceEl.innerHTML = statements.map(function (item) {
                    if (!item || !item.text) return '';
                    var supportHtml = item.supporting ? '<p class="statement-support">' + escapeHtml(item.supporting) + '</p>' : '';
                    return '<div class="experience-statement"><p class="statement-text serif">' + escapeHtml(item.text) + '</p>' + supportHtml + '</div>';
                }).join('');

                lpRevealOnScroll(sequenceEl.querySelectorAll('.experience-statement'), 180);
            })
            .catch(function (err) { console.error('Could not load Experience content:', err); });
    })();

    // BOOK CTA — reveal on scroll
    (function () {
        var el = document.querySelector('.book-cta-section');
        if (el) lpRevealOnScroll([el], 0);
    })();

    // SECTION REVEAL — as each section scrolls into view, its title
    // writes itself in (left-to-right clip reveal). Content is always
    // visible — no fade, no ease-in, no delay.
    (function () {
        if (!('IntersectionObserver' in window)) {
            document.querySelectorAll('.section-heading, .testimonials-label').forEach(function (el) { el.classList.add('is-revealed'); });
            return;
        }
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (!entry.isIntersecting) return;
                var section = entry.target;
                var heading = section.querySelector('.section-heading, .testimonials-label');
                if (heading && !heading.classList.contains('is-revealed')) {
                    heading.classList.add('is-revealed');
                }
                observer.unobserve(section);
            });
        }, { threshold: 0.15 });
        document.querySelectorAll('.section-block').forEach(function (s) { observer.observe(s); });
    })();

    // HERO VIDEO — resume on visibility change, same pattern as book.html.
    (function () {
        function resume() {
            var video = document.getElementById('lp-hero-video');
            if (video && video.paused) video.play().catch(function () {});
        }
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') resume(); });
        window.addEventListener('pageshow', resume);
        ['touchstart', 'click'].forEach(function (evt) { document.addEventListener(evt, resume, { passive: true }); });
    })();

    // FLOATING BOOK CTA — shown as soon as the visitor scrolls past
    // the hero (well before the reviews section) and then kept pinned
    // to the bottom of the viewport; it only sinks away again when
    // they scroll back to the very top, so it reads as one constant,
    // sticky action.
    (function () {
        var btn = document.getElementById('lp-float-book');
        var hero = document.querySelector('.lp-hero');
        if (!btn || !hero) return;
        var shown = false;
        var ticking = false;
        var meetSince = 0;
        var meetTimer = 0;
        function setVis(v) {
            if (shown === v) return;
            shown = v;
            btn.classList.toggle('is-visible', v);
        }
        function update() {
            ticking = false;
            var r = hero.getBoundingClientRect();
            var vh = window.innerHeight || document.documentElement.clientHeight;
            // The bar starts once the hero's bottom edge has cleared
            // roughly the lower half of the viewport (never over the hero
            // photograph, still well before the reviews) — and even then
            // it waits a short beat so it doesn't pop up the instant the
            // scroll crosses the line; only a sustained state triggers it.
            var meet = r.bottom < vh * 0.45;
            var now = Date.now();
            if (meet) {
                if (!meetSince) {
                    meetSince = now;
                    clearTimeout(meetTimer);
                    meetTimer = setTimeout(update, 350);
                }
                if (!shown && now - meetSince >= 350) setVis(true);
            } else {
                meetSince = 0;
                clearTimeout(meetTimer);
                if (shown) setVis(false);
            }
        }
        window.addEventListener('scroll', function () {
            if (!ticking) { ticking = true; requestAnimationFrame(update); }
        }, { passive: true });
        window.addEventListener('resize', function () {
            if (!ticking) { ticking = true; requestAnimationFrame(update); }
        }, { passive: true });
        // Deep-link / mid-page refresh: start in the correct state.
        update();
    })();
</script>

</body></html>
