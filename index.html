    <style>
        :root {
            --bg-body: #faf8f4;
            --bg-container: #ffffff;
            --bg-card: #fefdfb;
            --text-primary: #1a1815;
            --text-secondary: #6b6459;
            --accent: #8a7355;
            --accent-deep: #6e5c44;
            --border-color: #e8e3d9;
            --border-dashed: #d8d1c2;
            --btn-primary-bg: #1a1815;
            --btn-primary-text: #ffffff;
            --highlight-bg: #f8f4ec;
            --shadow-subtle: rgba(26,24,21,0.04);
            --shadow-hover: rgba(26,24,21,0.10);
            --shadow-lift: rgba(26,24,21,0.16);
            --logo-filter: invert(0);
            --hero-scrim-rgb: 20,18,16;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 6px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #161513;
                --bg-container: #1f1e1b;
                --bg-card: #262521;
                --text-primary: #f3f0ea;
                --text-secondary: #a8a196;
                --accent: #c4a67e;
                --accent-deep: #d9bf98;
                --border-color: #35332d;
                --border-dashed: #423f37;
                --btn-primary-bg: #c4a67e;
                --btn-primary-text: #161513;
                --highlight-bg: #24221d;
                --shadow-subtle: rgba(0,0,0,0.24);
                --shadow-hover: rgba(0,0,0,0.42);
                --shadow-lift: rgba(0,0,0,0.55);
                --logo-filter: invert(1);
                --hero-scrim-rgb: 6,6,7;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .serif { font-family: 'Fraunces', serif; }
        img { max-width: 100%; display: block; }

        .container { max-width: 1080px; margin: 0 auto; padding: 0 40px; }
        .section-block { padding: 100px 0; }
        .section-block.is-tinted { background: var(--bg-container); }
        .section-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 32px; letter-spacing: -0.3px; text-align: center; margin-bottom: 14px; }
        .section-meta { font-size: 14.5px; color: var(--text-secondary); text-align: center; max-width: 460px; margin: 0 auto 50px; line-height: 1.75; }

        /* GLASS BUTTONS, light-background variant — same frosted
           language as the hero buttons, tuned for legibility over a
           flat cream/dark surface instead of a photograph. No borders
           on either variant, by design. */
        .btn-dark { display: inline-block; background: rgba(26,24,21,0.05); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); color: var(--text-primary); padding: 16px 36px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; border-radius: 100px; text-decoration: none; transition: all 0.4s cubic-bezier(0.16,1,0.3,1); border: none; cursor: pointer; box-shadow: 0 4px 20px var(--shadow-subtle), inset 0 1px 0 rgba(255,255,255,0.5); }
        .btn-dark:hover { background: rgba(138,115,85,0.16); color: var(--accent-deep); transform: translateY(-2px); box-shadow: 0 14px 32px var(--shadow-hover), inset 0 1px 0 rgba(255,255,255,0.6); }
        @media (prefers-color-scheme: dark) {
            .btn-dark { background: rgba(255,255,255,0.06); box-shadow: 0 4px 20px var(--shadow-subtle), inset 0 1px 0 rgba(255,255,255,0.08); }
            .btn-dark:hover { background: rgba(196,166,126,0.18); }
        }

        /* PAGE ENTRANCE — a graceful fade-in rather than an abrupt pop,
           on first load and whenever arriving from another page. */
        body { opacity: 0; animation: lp-page-in 0.7s ease 0.05s forwards; }
        @keyframes lp-page-in { to { opacity: 1; } }

        /* SITE HEADER — fixed, minimal, logo only. Transparent and
           white over the hero image; gains a soft frosted backing once
           the hero has scrolled past, so the logo stays legible against
           whatever content follows. */
        .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 8px 0; transition: padding 0.35s ease, background 0.35s ease, box-shadow 0.35s ease; }
        .site-header.is-scrolled { padding: 6px 0; background: rgba(250,248,244,0.72); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); box-shadow: 0 1px 0 var(--border-color); }
        @media (prefers-color-scheme: dark) { .site-header.is-scrolled { background: rgba(22,21,19,0.72); } }
        .site-logo-link { display: block; }
        .site-logo { height: 38px; width: auto; filter: brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0,0,0,0.25)); transition: filter 0.35s ease, height 0.35s ease; }
        .site-header.is-scrolled .site-logo { filter: var(--logo-filter, none); height: 32px; }

        /* GLASS BUTTONS — used specifically over the hero image, where a
           frosted, translucent surface reads clearly; solid buttons
           elsewhere in the page stay as they are. */

        /* HERO — identical mechanics to the booking page: video or
           slideshow, controlled entirely from Settings. */
        .lp-hero { position: relative; height: 92vh; height: 92dvh; min-height: 560px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #141210; }
        .lp-hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
        .lp-hero-slideshow { position: absolute; inset: 0; }
        .lp-hero-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 0.9s ease; }
        .lp-hero-slide.is-active { opacity: 1; }
        .lp-hero-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 3; transition: opacity 0.1s ease; }
        .lp-hero-flash.is-flashing { opacity: 0.32; transition: opacity 0.06s ease; }
        .lp-hero-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(var(--hero-scrim-rgb),0.7), rgba(var(--hero-scrim-rgb),0.15) 55%); }
        .lp-hero-content { position: relative; padding: 0 6vw; color: #fff; max-width: 700px; text-align: center; }
        .lp-hero-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: clamp(30px, 5.5vw, 58px); line-height: 1.2; margin-bottom: 20px; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,0.4); }
        .lp-hero-sub { font-size: 14px; color: rgba(255,255,255,0.82); max-width: 380px; margin: 0 auto; line-height: 1.7; }

        /* SCROLL INDICATOR — a full-width frosted glass strip embedded
           into the hero's own bottom edge, as if that edge of the page
           itself were made of glass, rather than a floating element on
           top of it. It sits straddling the boundary; the hero's
           existing overflow:hidden naturally clips its lower half, so
           only the upper sliver (with the chevron) is ever visible. A
           slow breathing opacity pulse keeps it alive without drawing
           attention; it fades away entirely once scrolling begins —
           animation is explicitly cleared when hidden, since a running
           keyframe animation would otherwise keep fighting the fade. */
        .lp-scroll-indicator {
            position: absolute; left: 0; right: 0; bottom: -14px;
            height: 56px;
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: 14px;
            color: #fff;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.22);
            animation: lp-breathe 4s ease-in-out infinite;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        .lp-scroll-indicator.is-hidden { opacity: 0; animation: none; }
        @keyframes lp-breathe {
            0%, 100% { opacity: 0.75; }
            50% { opacity: 1; }
        }

        /* FEATURED WORK */
        /* FEATURED WORK — an editorial, magazine-style layout rather
           than a uniform grid: varied widths, varied aspect ratios, and
           deliberate vertical offsets create the asymmetric rhythm real
           print spreads use. Pattern repeats every 6 photos so it stays
           coherent regardless of how many are uploaded. */
        .work-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-bottom: 46px; min-height: 260px; }
        .work-item { position: relative; overflow: hidden; background: var(--bg-card); box-shadow: 0 6px 20px var(--shadow-subtle); grid-column: span 6; aspect-ratio: 3/4; }
        .work-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.16,1,0.3,1); }
        .work-item:hover img { transform: scale(1.05); }

        .work-item:nth-child(6n+1) { grid-column: span 7; aspect-ratio: 4/5; }
        .work-item:nth-child(6n+2) { grid-column: span 5; aspect-ratio: 3/4; margin-top: 64px; }
        .work-item:nth-child(6n+3) { grid-column: span 4; aspect-ratio: 3/4; }
        .work-item:nth-child(6n+4) { grid-column: span 4; aspect-ratio: 4/5; margin-top: -36px; }
        .work-item:nth-child(6n+5) { grid-column: span 4; aspect-ratio: 3/4; margin-top: 24px; }
        .work-item:nth-child(6n+6) { grid-column: span 12; aspect-ratio: 5/4; }
        .work-empty { text-align: center; color: var(--text-secondary); font-size: 13.5px; padding: 40px 0; }

        /* ABOUT */
        .about-grid { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 60px; align-items: center; }
        .about-photo { border-radius: var(--radius-lg); overflow: hidden; aspect-ratio: 4/5; background: var(--bg-card); box-shadow: 0 16px 40px var(--shadow-subtle); }
        .about-photo img { width: 100%; height: 100%; object-fit: cover; }
        .about-eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 16px; }
        .about-text h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 28px; margin-bottom: 20px; line-height: 1.3; }
        .about-text p { font-size: 14.5px; color: var(--text-secondary); line-height: 1.9; white-space: pre-line; }

        /* TESTIMONIALS */
        .testi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
        .testi-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 32px 28px; }
        .testi-quote { font-family: 'Fraunces', serif; font-style: italic; font-size: 15.5px; line-height: 1.7; margin-bottom: 20px; color: var(--text-primary); }
        .testi-quote::before { content: '\201C'; }
        .testi-quote::after { content: '\201D'; }
        .testi-name { font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; }

        /* BEGIN YOUR STORY — bridges Portfolio and Book. Interactive:
           clicking a session name expands its description directly
           beneath that title, with its real photo (same source as
           Book) sitting right beside the description text. */

        /* THE EXPERIENCE — an emotional bridge between Portfolio and
           Book: no session names, no prices, just what working
           together actually feels like. All text is dashboard-editable. */
        .experience-heading { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: clamp(24px, 3.4vw, 32px); text-align: center; max-width: 620px; margin: 0 auto 56px; line-height: 1.4; color: var(--text-primary); }
        .experience-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 44px; margin-bottom: 54px; }
        .experience-card { text-align: center; padding: 0 12px; }
        .experience-num { font-family: 'Fraunces', serif; font-style: italic; font-size: 13px; color: var(--accent); margin-bottom: 18px; }
        .experience-card h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 19px; margin-bottom: 14px; }
        .experience-card p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.85; }
        .experience-card.lp-reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1); will-change: opacity, transform; }
        .experience-card.lp-reveal.is-in { opacity: 1; transform: translateY(0); }


        .brand-footer { padding: 60px 0; text-align: center; border-top: 1px solid var(--border-color); }
        .footer-mark { font-size: 15px; font-weight: 500; letter-spacing: 0.3px; }

        /* MOBILE FEATURED WORK — a completely different presentation
           from the desktop editorial grid: one large main photo, with
           the rest looping continuously, top to bottom, in a narrow
           frosted glass strip along the edge. Tapping a thumbnail
           crossfades the main photo to it. Desktop-only otherwise;
           this never appears above the 900px breakpoint. */
        .work-mobile-feature { display: none; }
        @media (max-width: 900px) {
            .work-grid { display: none; }
            .work-mobile-feature {
                display: flex; aspect-ratio: 2.5/4; overflow: hidden; position: relative;
                background: var(--bg-card); box-shadow: 0 6px 20px var(--shadow-subtle); margin-bottom: 46px;
            }
            .work-main-photo { flex: 1; position: relative; overflow: hidden; min-width: 0; }
            .work-main-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease; }
            .work-main-photo img.is-active { opacity: 1; }
            .work-strip-wrap {
                width: 20%; position: relative; overflow-y: auto; overflow-x: hidden;
                background: rgba(255,255,255,0.12);
                backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%);
                scroll-behavior: smooth; scrollbar-width: none;
            }
            .work-strip-wrap::-webkit-scrollbar { display: none; }
            @media (prefers-color-scheme: dark) { .work-strip-wrap { background: rgba(255,255,255,0.07); } }
            .work-strip-track { display: flex; flex-direction: column; }
            .work-strip-thumb { position: relative; width: 100%; aspect-ratio: 1/1; border: none; padding: 3px; background: none; cursor: pointer; display: block; }
            .work-strip-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.65; transition: opacity 0.25s ease; }
            /* Active indicator — a frosted glass ring around the
               selected thumbnail, not just a plain opacity/border
               change, so it stays consistent with the rest of the
               glass language. */
            .work-strip-thumb.is-active img { opacity: 1; }
            .work-strip-thumb.is-active::after {
                content: ""; position: absolute; inset: 2px;
                border: 2px solid rgba(255,255,255,0.75);
                background: rgba(255,255,255,0.08);
                backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
                pointer-events: none;
            }
        }

        @media (max-width: 900px) {
            .about-grid { grid-template-columns: 1fr; gap: 32px; }
            .about-photo { max-width: 340px; margin: 0 auto; }
            .testi-grid { grid-template-columns: 1fr; }
            .experience-grid { grid-template-columns: 1fr; gap: 40px; max-width: 340px; margin-left: auto; margin-right: auto; }
        }
        @media (max-width: 600px) {
            .container { padding: 0 22px; }
            .section-block { padding: 70px 0; }
            .section-title { font-size: 25px; }
            .lp-hero { height: 100vh; height: 100dvh; }
            .lp-hero-title { font-size: clamp(26px, 8vw, 34px); }
            .lp-hero-sub { font-size: clamp(9.5px, 3.1vw, 12px); white-space: nowrap; max-width: none; }
        }
    </style>

<script>
    var API_BASE = 'https://liberty-booking-api.visualsliberty.workers.dev';

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = String(str == null ? '' : str);
        return div.innerHTML;
    }
    function formatNaira(n) { return '\u20a6' + Math.round(n).toLocaleString(); }

    // Simple one-time scroll reveal — fades/slides each element in the
    // moment it scrolls into view, staggered by index for a gentle
    // cascade. `.lp-reveal` alone (before this runs) is a no-op, so
    // content stays visible if JS fails.
    function lpRevealOnScroll(elements, stagger) {
        if (!('IntersectionObserver' in window)) return;
        var els = Array.prototype.slice.call(elements);
        if (!els.length) return;
        els.forEach(function (el) { el.classList.add('lp-reveal'); });

        var pendingHides = new WeakMap();

        // Anything already genuinely on-screen the instant this runs
        // shows immediately, no animation or scroll needed to "earn" it.
        els.forEach(function (el) {
            var rect = el.getBoundingClientRect();
            if (rect.bottom > 0 && rect.top < window.innerHeight) {
                el.classList.add('is-in');
            }
        });

        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                var el = entry.target;
                if (entry.isIntersecting) {
                    var pendingHide = pendingHides.get(el);
                    if (pendingHide) { clearTimeout(pendingHide); pendingHides.delete(el); }
                    if (el.classList.contains('is-in')) return;
                    var idx = els.indexOf(el);
                    el.style.transitionDelay = (idx * (stagger || 0)) + 'ms';
                    el.classList.add('is-in');
                } else {
                    if (!el.classList.contains('is-in') || pendingHides.has(el)) return;
                    var hideTimer = setTimeout(function () {
                        pendingHides.delete(el);
                        el.style.transitionDelay = '0ms';
                        el.classList.remove('is-in');
                    }, 400);
                    pendingHides.set(el, hideTimer);
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -10% 0px' });
        els.forEach(function (el) { observer.observe(el); });
    }

    // HERO — identical logic to the booking page: two separate render
    // paths based on hero_mode, never mixing video and slideshow.
    (function () {
        function renderVideo(s) {
            if (!s.hero_video_url) return;
            var oldVideo = document.getElementById('lp-hero-video');
            var newVideo = oldVideo.cloneNode(false);
            newVideo.muted = true;
            newVideo.innerHTML = '<source src="' + API_BASE + s.hero_video_url + '" type="video/mp4">';
            oldVideo.parentNode.replaceChild(newVideo, oldVideo);
            newVideo.play().catch(function (err) { console.error('Hero video could not autoplay:', err.message); });
        }
        function renderSlideshow() {
            document.getElementById('lp-hero-video').style.display = 'none';
            var container = document.getElementById('lp-hero-slideshow');
            var flash = document.getElementById('lp-hero-flash');
            fetch(API_BASE + '/api/hero-images')
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    var images = data.images || [];
                    if (!images.length) return;
                    container.style.display = 'block';
                    container.innerHTML = images.map(function (img, i) {
                        return '<div class="lp-hero-slide' + (i === 0 ? ' is-active' : '') + '" style="background-image:url(' + API_BASE + img.imageUrl + ')"></div>';
                    }).join('');
                    if (images.length < 2) return;
                    var slides = container.querySelectorAll('.lp-hero-slide');
                    var current = 0;
                    setInterval(function () {
                        var next = (current + 1) % slides.length;
                        flash.classList.add('is-flashing');
                        setTimeout(function () { flash.classList.remove('is-flashing'); }, 90);
                        slides[current].classList.remove('is-active');
                        slides[next].classList.add('is-active');
                        current = next;
                    }, 2000);
                })
                .catch(function (err) { console.error('Could not load hero slideshow:', err); });
        }

        fetch(API_BASE + '/api/settings')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var s = data.settings || {};
                if (s.hero_mode === 'slideshow') { renderSlideshow(); } else { renderVideo(s); }

                if (s.logo_url) {
                    var siteLogo = document.getElementById('site-logo-img');
                    siteLogo.src = API_BASE + s.logo_url;
                    siteLogo.style.display = 'block';
                }

                // ABOUT — only shown once real content exists in Settings,
                // never with placeholder/fabricated text.
                if (s.about_photo_url && s.about_bio) {
                    document.getElementById('about-photo-img').src = API_BASE + s.about_photo_url;
                    document.getElementById('about-bio-text').textContent = s.about_bio;
                    document.getElementById('about-section').style.display = 'block';
                }
            })
            .catch(function (err) { console.error('Could not load settings:', err); });
    })();

    // SITE HEADER — frosted/solid once the hero has scrolled past,
    // transparent with a whited-out logo while still over the hero image.
    (function () {
        var header = document.getElementById('site-header');
        var hero = document.querySelector('.lp-hero');
        if (!header || !hero || !('IntersectionObserver' in window)) return;
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                header.classList.toggle('is-scrolled', !entry.isIntersecting);
            });
        }, { threshold: 0, rootMargin: '-80% 0px 0px 0px' });
        observer.observe(hero);
    })();

    // SCROLL INDICATOR — fades away the moment the visitor actually
    // starts scrolling; its job is done at that point.
    (function () {
        var indicator = document.querySelector('.lp-scroll-indicator');
        if (!indicator) return;
        window.addEventListener('scroll', function () {
            indicator.classList.toggle('is-hidden', window.scrollY > 12);
        }, { passive: true });
    })();

    // FEATURED WORK — a small real sample from the portfolio, one per
    // category where possible, linking to the full gallery. Builds both
    // the desktop editorial grid and the mobile main+strip component
    // from the same data; only one is ever visible at a time (CSS).
    (function () {
        var grid = document.getElementById('work-grid');
        var mobileFeature = document.getElementById('work-mobile-feature');
        fetch(API_BASE + '/api/portfolio?publishedOnly=true')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var items = data.items || [];
                if (!items.length) {
                    grid.innerHTML = '<p class="work-empty">New work coming soon.</p>';
                    return;
                }
                var sample = items.slice(0, 8);
                grid.innerHTML = sample.map(function (item) {
                    return '<div class="work-item"><img src="' + API_BASE + item.imageUrl + '" alt="' + escapeHtml(item.category) + '" loading="lazy"></div>';
                }).join('');

                buildMobileFeature(sample);
            })
            .catch(function () { grid.innerHTML = '<p class="work-empty">Couldn\'t load work right now.</p>'; });

        function buildMobileFeature(sample) {
            if (!mobileFeature || sample.length < 2) return; // need at least 2 photos for a main photo + a strip to make sense

            var thumbsHtml = sample.map(function (item, i) {
                return '<button type="button" class="work-strip-thumb' + (i === 0 ? ' is-active' : '') + '" data-index="' + i + '"><img src="' + API_BASE + item.imageUrl + '" alt="" loading="lazy"></button>';
            }).join('');

            mobileFeature.innerHTML =
                '<div class="work-main-photo">' +
                    sample.map(function (item, i) {
                        return '<img src="' + API_BASE + item.imageUrl + '" alt="' + escapeHtml(item.category) + '" class="' + (i === 0 ? 'is-active' : '') + '" data-index="' + i + '">';
                    }).join('') +
                '</div>' +
                '<div class="work-strip-wrap" id="work-strip-wrap">' +
                    '<div class="work-strip-track">' + thumbsHtml + '</div>' +
                '</div>';

            var mainImgs = mobileFeature.querySelectorAll('.work-main-photo img');
            var stripWrap = document.getElementById('work-strip-wrap');
            var thumbs = mobileFeature.querySelectorAll('.work-strip-thumb');

            thumbs.forEach(function (btn, i) {
                btn.addEventListener('click', function () {
                    var idx = btn.dataset.index;
                    mainImgs.forEach(function (img) { img.classList.toggle('is-active', img.dataset.index === idx); });
                    thumbs.forEach(function (t) { t.classList.toggle('is-active', t.dataset.index === idx); });

                    // Clicking near the end of what's currently visible
                    // scrolls the strip ahead, revealing more thumbnails
                    // below — the strip itself no longer auto-moves, so
                    // this is what keeps the rest reachable.
                    if (i >= sample.length - 3) {
                        stripWrap.scrollBy({ top: btn.offsetHeight * 3, behavior: 'smooth' });
                    }
                });
            });
        }
    })();

    // TESTIMONIALS — real quotes only, section stays hidden if none exist yet.
    (function () {
        var grid = document.getElementById('testi-grid');
        var section = document.getElementById('testimonials-section');
        fetch(API_BASE + '/api/testimonials?publishedOnly=true')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var items = data.testimonials || [];
                if (!items.length) return;
                grid.innerHTML = items.slice(0, 6).map(function (t) {
                    return '<div class="testi-card"><p class="testi-quote">' + escapeHtml(t.quote) + '</p><div class="testi-name">' + escapeHtml(t.clientName) + '</div></div>';
                }).join('');
                section.style.display = 'block';
            })
            .catch(function (err) { console.error('Could not load testimonials:', err); });
    })();

    // THE EXPERIENCE — pulled entirely from Settings (dashboard-editable).
    // Stays hidden if the heading hasn't been filled in yet, same honesty
    // rule as About and Testimonials — never shows placeholder text.
    (function () {
        var headingEl = document.getElementById('experience-heading');
        var gridEl = document.getElementById('experience-grid');

        fetch(API_BASE + '/api/settings')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var s = data.settings || {};
                if (!s.experience_heading) return;

                headingEl.textContent = s.experience_heading;

                var steps = [
                    { title: s.experience_step1_title, desc: s.experience_step1_desc },
                    { title: s.experience_step2_title, desc: s.experience_step2_desc },
                    { title: s.experience_step3_title, desc: s.experience_step3_desc },
                ].filter(function (step) { return step.title; });

                gridEl.innerHTML = steps.map(function (step, i) {
                    return '<div class="experience-card">' +
                        '<div class="experience-num">0' + (i + 1) + '</div>' +
                        '<h3 class="serif">' + escapeHtml(step.title) + '</h3>' +
                        '<p>' + escapeHtml(step.desc || '') + '</p>' +
                    '</div>';
                }).join('');

                lpRevealOnScroll(gridEl.querySelectorAll('.experience-card'), 120);
            })
            .catch(function (err) { console.error('Could not load Experience content:', err); });
    })();

    // HERO VIDEO — resume on visibility change, same pattern as book.html.
    (function () {
        function resume() {
            var video = document.getElementById('lp-hero-video');
            if (video && video.paused) video.play().catch(function () {});
        }
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') resume(); });
        window.addEventListener('pageshow', resume);
        ['touchstart', 'click'].forEach(function (evt) { document.addEventListener(evt, resume, { passive: true }); });
    })();
</script>

</body></html>
