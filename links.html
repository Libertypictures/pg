<style>
    :root {
        --bg: #faf8f4;
        --text: #1a1815;
        --text-soft: #6b6459;
        --accent: #8a7355;
        --border: #e8e3d9;
        --card-bg: rgba(26,24,21,0.03);
        --card-hover: rgba(138,115,85,0.10);
        --shadow: rgba(26,24,21,0.06);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #161513;
            --text: #f3f0ea;
            --text-soft: #a8a196;
            --accent: #c4a67e;
            --border: #35332d;
            --card-bg: rgba(255,255,255,0.04);
            --card-hover: rgba(196,166,126,0.14);
            --shadow: rgba(0,0,0,0.3);
        }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Poppins', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex; flex-direction: column; align-items: center;
        padding: 60px 24px 40px;
        -webkit-font-smoothing: antialiased;
        opacity: 0; animation: fade-in 0.6s ease 0.05s forwards;
    }
    @keyframes fade-in { to { opacity: 1; } }

    .links-header { text-align: center; margin-bottom: 36px; }
    .links-logo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; margin: 0 auto 16px; display: block; }
    .links-name { font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; margin-bottom: 6px; }
    .links-tagline { font-size: 13px; color: var(--text-soft); max-width: 260px; margin: 0 auto; line-height: 1.6; }

    .links-list { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
    .link-item {
        display: flex; align-items: center; gap: 14px;
        background: var(--card-bg);
        padding: 18px 22px;
        text-decoration: none; color: var(--text);
        transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        box-shadow: 0 2px 8px var(--shadow);
    }
    .link-item:hover {
        background: var(--card-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px var(--shadow);
    }
    .link-icon { flex-shrink: 0; width: 20px; height: 20px; color: var(--accent); }
    .link-icon svg { width: 100%; height: 100%; }
    .link-text { flex: 1; }
    .link-text .link-title { font-weight: 600; font-size: 13.5px; letter-spacing: 0.3px; }
    .link-text .link-desc { font-size: 11.5px; color: var(--text-soft); margin-top: 2px; }
    .link-arrow { color: var(--text-soft); font-size: 14px; opacity: 0.5; }

    .links-footer { margin-top: 40px; text-align: center; font-size: 11px; color: var(--text-soft); }
    .links-footer a { color: var(--accent); text-decoration: none; }

    @media (prefers-reduced-motion: reduce) {
        body { animation: none; opacity: 1; }
        .link-item { transition: none; }
    }
</style>
</head>

<script>
    var API_BASE = 'https://liberty-booking-api.visualsliberty.workers.dev';
    fetch(API_BASE + '/api/settings')
        .then(function (res) { return res.json(); })
        .then(function (data) {

                var logo = document.getElementById('links-logo');
