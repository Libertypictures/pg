<style>
    :root {
        --bg: #faf8f4; --text: #1a1815; --text-soft: #6b6459; --accent: #8a7355; --accent-deep: #6e5c44;
        --border: #e8e3d9; --card-bg: rgba(26,24,21,0.03); --card-hover: rgba(138,115,85,0.10);
        --shadow: rgba(26,24,21,0.06); --shadow-lift: rgba(26,24,21,0.14);
        /* The names the ASSISTANT reads, mapped onto this page's own palette.
           The widget's door is built from this page's tokens or from its own
           light-theme defaults, and this page's tokens are named differently —
           so without these three lines the door would be the right shape in the
           wrong colours in dark mode, which is worse than either. Same values,
           two names, one material. */
        --bg-card: #fffdfa; --border-color: var(--border); --text-secondary: var(--text-soft);
        /* The chat SHEET's surface, which the widget takes from these two names.
           This page did not map them, and the widget's own fallback was a
           literal white — so on a phone in dark mode the assistant opened as a
           white panel over a near-black page. The widget now falls back to a
           dark surface of its own, and this page names them anyway: two reasons
           the same box cannot come out the wrong colour. */
        --bg-container: var(--bg); --text-primary: var(--text);
        --btn-primary-bg: #1a1815; --btn-primary-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #161513; --text: #f3f0ea; --text-soft: #a8a196; --accent: #c4a67e; --accent-deep: #d9bf98;
            --border: #35332d; --card-bg: rgba(255,255,255,0.04); --card-hover: rgba(196,166,126,0.14);
            --shadow: rgba(0,0,0,0.3); --shadow-lift: rgba(0,0,0,0.5);
            --bg-card: #201e1b; --btn-primary-bg: #f3f0ea; --btn-primary-text: #1a1815;
            --bg-container: var(--bg); --text-primary: var(--text);
        }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text);
        min-height: 100vh; min-height: 100svh;
        display: flex; flex-direction: column; align-items: center;
        padding: 48px 20px 40px; -webkit-font-smoothing: antialiased;
        opacity: 0; animation: fade-in 0.6s ease 0.05s forwards;
    }
    @keyframes fade-in { to { opacity: 1; } }

    .page { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px; }

    /* ==== Identity — welcome line only, no logo ==== */
    .brand { text-align: center; padding: 8px 0 4px; }
    .brand-welcome {
        font-size: 13px; color: var(--text-soft); font-weight: 400; letter-spacing: 0.2px;
        /* Subtle grow-in on first load — starts a touch smaller and
           settles at full size, timed after the page fade so it reads
           as a graceful arrival, never a "look at me" animation. */
        opacity: 0; transform: scale(0.86);
        animation: welcome-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
    }
    @keyframes welcome-in {
        to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
        .brand-welcome { animation: none; opacity: 1; transform: none; }
    }

    /* ==== Link cards — one uniform style, no colored "primary" ====

       TWO NUMBERS HERE ARE NOT THIS PAGE'S OWN, AND IT IS DELIBERATE.

       The assistant's card is built by the widget, not by this page, and it is
       drawn first: `border-radius: 18px` and `padding: 15px 16px`, in
       assistant.js, where it also appears on every other page. The two doors
       below it were once square-cornered and padded 16px 18px, so a visitor
       looking at the page saw a rounded card sitting on top of sharp ones whose
       text started two pixels further right — the assistant looked bolted on by
       someone who had not seen the rest, which is the opposite of the intent.

       So the page matches the CARD rather than the card matching the page: the
       radius is the same 18, the gap and padding are the card's 13 and 15/16,
       and there is a guard in tools/test-assistant-widget.js that fails if the
       two radii ever drift apart — because the failure mode here is silent, and
       it is a visitor who notices it. */
    .link-list { display: flex; flex-direction: column; gap: 10px; }
    .link-card {
        display: flex; align-items: center; gap: 13px;
        background: var(--card-bg); border: 1px solid var(--border);
        padding: 15px 16px; border-radius: 18px; text-decoration: none; color: var(--text);
        transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        box-shadow: 0 2px 8px var(--shadow);
    }
    @media (hover: hover) { .link-card:hover { background: var(--card-hover); transform: translateY(-2px); box-shadow: 0 10px 26px var(--shadow-lift); border-color: var(--accent); } }
    .link-card:active { transform: translateY(0); }
    /* Keyboard gets the same signal a hover gets. Four of these cards and a face
       above them were all reachable with Tab and none of them said so — and
       `--card-hover` is already the page's own tint, so the ring follows the
       colour scheme instead of being a second brown that only works in light. */
    .link-card:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--card-hover); }
    /* A 360px phone was giving a fifth of its width to margin. The cards get the
       room instead: this is the page people open from a bio link, one-handed,
       and the longest description on it is the one that wraps. */
    @media (max-width: 380px) {
        body { padding: 32px 16px 32px; }
        .page { gap: 18px; }
    }
    .link-icon { flex-shrink: 0; width: 22px; height: 22px; color: var(--accent); display: flex; align-items: center; justify-content: center; }
    .link-icon svg { width: 100%; height: 100%; stroke-width: 1.6; }

    /* ==== The assistant's door ================================================

       The FIRST thing on this page, and the only entry that ANSWERS rather
       than sends you somewhere. Tapping it opens the assistant itself, and the
       widget draws it from this page's tokens so it sits among the cards below
       as one of them rather than as a panel bolted on. It is first because
       somebody arriving from an Instagram bio usually has one question, and the
       four destinations underneath all make them choose before they have asked
       it.

       IT IS A CARD, NOT A BOX TO TYPE IN. It was a text field with an Ask
       button, and that was a worse idea than it looked: the visitor typed their
       question on the page, the sheet opened over it, and the answer arrived
       beside a SECOND field — two boxes for one conversation, and the one they
       had just used was the one that could not answer. One tap, one place to
       type, and that place is the composer the reply appears above.

       The element is EMPTY, and the widget fills it: a place, never a copy of
       the behaviour or of the face. That is why it renders as nothing at all
       while empty — a page must never show a card that cannot open — and why
       the reservation for a floating dock is gone from this page. There is no
       dock here any more: the widget stands its dock down when a page owns a
       door, so nothing floats over the copyright line and nothing needs room
       under it. */
    .link-ask:empty { display: none; }
    .link-ask { margin-bottom: 2px; }
    .link-text { flex: 1; min-width: 0; }
    .link-title { font-weight: 600; font-size: 13.5px; letter-spacing: 0.2px; }
    .link-desc { font-size: 11.5px; color: var(--text-soft); margin-top: 3px; }
    .link-arrow { color: var(--text-soft); font-size: 16px; opacity: 0.45; flex-shrink: 0; }

    /* ==== Footer — contact and reviews, AS ONE QUIET ROW ================

       WhatsApp and Email used to be two more full cards in the list above,
       which made five destinations of equal weight — and the owner's note was
       that the page had "too many options". They are not destinations; they are
       ways of reaching a person, and a visitor choosing between them is a
       visitor choosing before they know what they want. So they are one line of
       small text at the foot of the page, with the review link beside them, and
       the three doors above keep the room.

       THE INSTAGRAM LINK IS GONE, and deliberately: this page exists because an
       Instagram bio can hold only one link, so it is opened by people who are
       already on Instagram. A row of social icons on a link-in-bio page sends
       its one tap back where it came from. */
    .links-footer {
        margin-top: 22px; text-align: center;
        display: flex; flex-direction: column; gap: 12px; align-items: center;
    }
    .links-thin {
        display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline;
        gap: 4px 8px; font-size: 12px; letter-spacing: 0.2px;
    }
    .thin-link { color: var(--text-soft); text-decoration: none; transition: color 0.2s ease; }
    @media (hover: hover) { .thin-link:hover { color: var(--accent); text-decoration: underline; } }
    .thin-link:focus-visible { outline: none; color: var(--accent); text-decoration: underline; }
    .thin-dot { color: var(--text-soft); opacity: 0.5; }
    .footer-copy { opacity: 0.55; font-size: 10.5px; letter-spacing: 0.3px; }

    @media (prefers-reduced-motion: reduce) {
        body { animation: none; opacity: 1; }
        .link-card { transition: none; }
    }
</style>

<body>

<main class="page">
    <!-- Identity: just a warm welcome line — logo intentionally omitted -->
    <header class="brand">
        <p class="brand-welcome">Glad you're here.</p>
    </header>

    <!-- THREE DOORS AND NOTHING ELSE COMPETING WITH THEM.

         It was five: a portrait link, a wedding link, WhatsApp, Email and the
         assistant's own card. The owner's read was that the page had "too many
         options", and he was right in a way that mattered — a link-in-bio page
         opened one-handed from a bio is not a menu, it is the moment somebody
         decides whether to ask a question or leave. Two destinations carry the
         real work (the studio, and weddings); the assistant is the one card that
         ANSWERS rather than sends you somewhere; and WhatsApp, Email and the
         review link are one quiet line in the footer, because they are ways of
         reaching a person rather than places to go.

         The portrait card used to be labelled "Portrait Sessions", which read
         as a packages page — the owner's words were that it "sounds like a
         packages page". It is The Studio now, and points at the home page, which
         is what it always led to. -->
    <nav class="link-list" aria-label="Links">
        <!-- THE ASSISTANT. A link-in-bio page is four destinations and no way
             to ask anything, so a visitor with one question has to guess which
             of the four answers it. This is the one entry that answers — and it
             is a door, not a box: tapping it opens the assistant, rather than
             offering a second field that exists only to be abandoned when the
             real one opens.

             The element stays EMPTY until the widget fills it, and the widget
             builds the face, the words and the whole card: a page owns a place
             and never a copy of the behaviour, the same rule the face slots
             follow. Nothing here needs a script of its own, and nothing here can
             be a dead button — if the widget does not run, this renders as
             nothing at all and the four links below it are exactly as they
             were. -->
        <div class="link-ask" id="links-ask" data-lp-door></div>
        <a href="https://libertymusa.com/?utm_source=igbio&amp;utm_medium=links&amp;utm_campaign=studio" class="link-card">
            <div class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></div>
            <div class="link-text">
                <div class="link-title">The Studio</div>
                <div class="link-desc">Portraits, families, brands — the work, what's included, and how to book</div>
            </div>
            <span class="link-arrow">›</span>
        </a>
        <a href="https://libertymusa.com/wedding.html?utm_source=igbio&amp;utm_medium=links&amp;utm_campaign=weddings" class="link-card">
            <div class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>
            <div class="link-text">
                <div class="link-title">Weddings</div>
                <div class="link-desc">Beloved Imprint — from the pre-wedding to the first dance</div>
            </div>
            <span class="link-arrow">›</span>
        </a>
    </nav>

    <!-- Footer: one quiet line of ways to reach a person, then the copyright.
         No Instagram — see the note above the thin-row styles. -->
    <footer class="links-footer">
        <nav class="links-thin" aria-label="Contact and reviews">
            <a class="thin-link" href="https://wa.me/2349075170240?text=Hi%20Liberty%2C%20I%27d%20like%20to%20chat%20about%20a%20session." target="_blank" rel="noopener">WhatsApp</a>
            <span class="thin-dot" aria-hidden="true">·</span>
            <a class="thin-link" href="mailto:visualsliberty@gmail.com">Email</a>
            <span class="thin-dot" aria-hidden="true">·</span>
            <a class="thin-link" href="https://libertymusa.com/review.html?utm_source=igbio&amp;utm_medium=links">Leave a review</a>
        </nav>
        <div class="footer-copy">Libertypictures © 2026</div>
    </footer>
</main>

<!-- NO SCRIPT OF THIS PAGE'S OWN, AND NO REQUEST OF ITS OWN EITHER.

     There used to be one: a fetch of /api/settings whose only use was the
     Instagram handle in the footer. With Instagram gone the page has nothing to
     ask the API for, so it no longer opens a connection to it at all — one less
     round trip on a page whose entire visit is a few seconds on a phone, and one
     less thing that can be slow on the cold-load path.

     The door above is filled by the widget, and that is the whole point: a page
     that builds its own version of the way in is how two versions of one
     behaviour begin to disagree, and a page that reveals a door it cannot open is
     how a dead button ships. If the assistant is off, the slot stays empty, the
     page renders as it did before the assistant existed, and nobody is asked to
     tap anything that does nothing. -->
<!-- The studio assistant. It answers from the studio's live data and hands
     anything it cannot answer to Liberty. If it is not switched on it removes
     itself, so this page renders exactly as it did before it existed. -->
<script src="assistant.js?v=f442c04008" defer></script>
</body>
