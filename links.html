<link rel="stylesheet" href="/vendor/fonts.css?v=2ca4e079b3">
<style>
    :root {
        --bg: #faf8f4; --text: #1a1815; --text-soft: #6b6459; --accent: #8a7355; --accent-deep: #6e5c44;
        --border: #e8e3d9; --card-bg: rgba(26,24,21,0.03); --card-hover: rgba(138,115,85,0.10);
        --shadow: rgba(26,24,21,0.06); --shadow-lift: rgba(26,24,21,0.14);
        /* The names the ASSISTANT reads, mapped onto this page's own palette.
           The widget's door is built from this page's tokens or from its own
           light-theme defaults, and this page's tokens are named differently —
           so without these three lines the door would be the right shape in the
           wrong colours in dark mode, which is worse than either. Same values,
           two names, one material. */
        --bg-card: #fffdfa; --border-color: var(--border); --text-secondary: var(--text-soft);
        /* The chat SHEET's surface, which the widget takes from these two names.
           This page did not map them, and the widget's own fallback was a
           literal white — so on a phone in dark mode the assistant opened as a
           white panel over a near-black page. The widget now falls back to a
           dark surface of its own, and this page names them anyway: two reasons
           the same box cannot come out the wrong colour. */
        --bg-container: var(--bg); --text-primary: var(--text);
        --btn-primary-bg: #1a1815; --btn-primary-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #161513; --text: #f3f0ea; --text-soft: #a8a196; --accent: #c4a67e; --accent-deep: #d9bf98;
            --border: #35332d; --card-bg: rgba(255,255,255,0.04); --card-hover: rgba(196,166,126,0.14);
            --shadow: rgba(0,0,0,0.3); --shadow-lift: rgba(0,0,0,0.5);
            --bg-card: #201e1b; --btn-primary-bg: #f3f0ea; --btn-primary-text: #1a1815;
            --bg-container: var(--bg); --text-primary: var(--text);
        }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Poppins', sans-serif; color: var(--text);
        min-height: 100vh; min-height: 100svh;
        display: flex; flex-direction: column; align-items: center;
        /* 48px of empty air above the greeting was where the Abuja stamp now
           stands, so the greeting and every door under it kept the place they
           already had. See the note over the Day / Night styles. */
        padding: 20px 20px 40px; -webkit-font-smoothing: antialiased;
        opacity: 0; animation: fade-in 0.6s ease 0.05s forwards;

        /* THE MURAL IS PAINTED ON THE BODY, not on the page's own 420px column,
           because it is the one part of this that has to reach the edges of the
           window: a drawing that stopped at the column would draw the column's
           outline and put the illustration back inside a box. The body is also
           the mural's POSITIONING CONTEXT, which is what lets the layer below be
           as tall as the page rather than as tall as the window.

           The wash is the LIGHT the mural is drawn in — one soft rise from above
           the top of the page that has spent itself by the time the city arrives
           at the foot of it — and it is an image layer OVER the page's own --bg
           rather than a replacement for it. The ground a visitor reads is still
           this page's ground, one tint deep, which is what keeps the greeting,
           the cards and the footer the contrast they already had.

           ONE LIGHT, NOT TWO. This was two radial gradients, each parked over a
           top corner, and two is what a visitor sees: two smudges that clearly
           belong to whatever put them there. One light falling from above and
           gone by the middle of the page is a room rather than an effect. */
        position: relative;
        background-color: var(--bg);
        background-image: radial-gradient(132% 46% at 50% -6%, var(--dn-haze), var(--dn-haze-0) 100%);
        background-repeat: no-repeat;
        background-size: 100% 100%;
    }
    @keyframes fade-in { to { opacity: 1; } }

    /* THE COLUMN EVERYTHING A VISITOR CAME FOR STANDS IN — and NOT the mural's
       positioning context, which is the one line of this that carries the whole
       design. A drawing that has to reach the corners of the window cannot live
       inside a 420px box, so the mural is hung on the body and is as wide as the
       window instead. */
    .page { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px; }

    /* ==== Identity — the welcome line, and the hour it came from ==== */
    .brand { text-align: center; padding: 0 0 2px; }
    .brand-welcome {
        font-size: 13px; color: var(--text-soft); font-weight: 400; letter-spacing: 0.2px;
        /* Subtle grow-in on first load — starts a touch smaller and
           settles at full size, timed after the page fade so it reads
           as a graceful arrival, never a "look at me" animation. */
        opacity: 0; transform: scale(0.86);
        animation: welcome-in 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
    }
    @keyframes welcome-in {
        to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
        .brand-welcome { animation: none; opacity: 1; transform: none; }
    }

    /* ==== Day / Night — the studio's own corner of Abuja, as a mural ==========

       The page had a greeting and nothing of the studio's own place in it. This
       is that place: a sketched Abuja — Aso Rock and its mast behind the city,
       the mosque's dome between two minarets, a branch of leaves climbing the
       left edge — drawn ONCE and lit TWICE, the way the reference sheet puts one
       drawing under a sun and under a crescent moon.

       IT IS A MURAL, NOT A PANEL. The first version of this stood in the identity
       header and read as a picture above a links page: two designs in one column.
       The second laid the same drawing into the top of the page as a shallow
       horizon band, and that was worse in a quieter way — a strip of dense
       linework standing exactly where the greeting stands is a strip nobody
       asked for, and the page read as a page with a drawing added to it. So it is
       neither. The drawing is spread across the WHOLE page and nearly all of it
       is at the page's EDGES — the weather across the top and to the right, the
       city along the foot, the plant up the left — with the middle of the page
       left empty for the one thing a visitor came for. Corners and edges are
       where a mural lives, and it is the reason this one reads as the page's own
       ground rather than as something laid over it.

       A THIRD OF THE MARKS, OVER FOUR TIMES THE DISTANCE. The band carried
       nineteen buildings, nine leaves, twenty-one stars and twenty-two lit
       windows inside a 420-unit strip, which is a drawing dense enough to be the
       SUBJECT of the page. The mural carries a third of that spread from the top
       of the window to the bottom of the page. Cutting the count is only half of
       it: a mark is quiet because it is far from the next mark, so the same
       drawing stretched over four times the area is a different object rather
       than a smaller version of the same one. That is what tools/test-links-day-
       night.js now counts — the marks and the distance between them — because
       "minimal" is the one property here that a later edit can quietly undo.

       WHICH OF THE TWO LIGHTS A VISITOR SEES IS NOT A PREFERENCE, IT IS THE HOUR.
       The reference shows both sides so the two can be judged together; on a page
       a visitor gets the one that is true where the studio is, and the head script
       decides that from Abuja's own clock. The hour decides the SKY and nothing
       else — the sun, the crescent, the stars, the windows that are lit. THE
       LIGHT AND THE INK FOLLOW THE VISITOR'S COLOUR SCHEME INSTEAD, and that
       split is the point rather than a compromise: a phone in light mode cannot
       have its background turned to charcoal because it is late in Lagos, or the
       cards, the assistant's sheet and the greeting would all be light ink on a
       light surface. Two systems, two questions — "what hour is it where the
       studio is" and "what surface is this visitor reading" — and the page holds
       up in all four of the states they can be in together.

       THE INK IS FAINT ON PURPOSE, AND IT IS ONE COLOUR. Every mark on the page
       is `currentColor` from a single token, so the mural is drawn with one pen
       and cannot drift into being several drawings; the token is a little over a
       quarter of the way from the page's own text colour, the strongest a line
       can be and still read as a place the page IS rather than as something
       printed on it. The wash under it is MEASURED, not judged: the greeting is
       `--text-soft`, the least contrasty ink this page has, and it sits in the
       thickest part of the light, so tools/test-links-day-night.js computes all
       four states and fails if a later edit buys a prettier wash with the
       legibility of the page's own words. The wash also ends in its OWN colour at
       zero alpha rather than in `transparent`, so a fade cannot pass through grey
       on the way out.

       IT COSTS THE PAGE NO HEIGHT, TAKES NO TAP, AND HAS NO OUTER EDGE. It is
       absolute and it spans the whole page, so it cannot push a door down at any
       width; it refuses pointer events, so a drawing that lies over a door cannot
       swallow the tap that door was for; and because the city stands ON the
       page's own bottom edge and runs off both sides, there is no edge of the
       drawing anywhere for the eye to find. That last one is why the mask this
       used to carry is gone: a mask was dissolving a bottom edge that no longer
       exists, and a rule that is doing nothing is a rule that will be believed.

       THE PICTURE IS INLINE SVG, so it is one request fewer than an image file
       and cannot 404 in a cache. It is in THREE PIECES rather than one because
       the three do not share a scale: the city is as wide as the window and
       scales with its width, the sky is one wide field above it, and the plant is
       sized against the page's HEIGHT because up is the direction it grows in. A
       single box holding all three could only be right at one window size — it
       would either letterbox the plant or stretch the city — so each is its own
       inline drawing at its own scale, each hung on the edge it belongs to. */
    /* THE TOKENS LIVE ON THE ROOT, not on the mural, because TWO surfaces read
       them: the body (the light the mural is drawn in) and the mural (its pen).
       The wash is named twice — its colour, and that same colour at zero alpha —
       so a fade can end in its own ink at nothing rather than in `transparent`. */
    :root {
        --dn-haze: rgba(226,206,166,.10);  --dn-haze-0: rgba(226,206,166,0);
        --dn-ink: rgba(41,37,30,.28);
        --dn-star: rgba(41,37,30,.38);
        /* THE LAMPS ARE NOT LIT ON PAPER. This was `#b0803a` — an amber lamp on
           white paper, which is a window nobody has ever seen from a street in
           daylight. On a light surface a window seen from outside is a dark
           OPENING, so on paper it is the same ink family as the rest of this pen.

           AND IT IS AT 55% RATHER THAN AT 42%, which is the owner's correction
           after looking at it: the pen is 28%, so an opening at 42% was a window
           nobody could see — on paper the night city was the day city with nine
           marks a hair darker in it, and the note that came back was that they
           could not tell whether the two skylines were any different. Down here
           this is the WHOLE of the difference, because the hour changes nothing
           else in the city: an opening has to be darker than the linework that
           outlines it, or it is not an opening. The amber lamp still exists,
           further down, where a lit window belongs: on a dark surface. */
        --dn-lit: rgba(41,37,30,.55);
    }
    /* The same light after dark: cooler, and no deeper. Selected off the document
       element, which the head script stamps before any of this is parsed — so
       there is no first frame in which the wrong side is on screen. */
    html[data-abj="night"] {
        --dn-haze: rgba(174,186,208,.10);  --dn-haze-0: rgba(174,186,208,0);
    }
    /* ON A DARK SURFACE, AND ONLY THERE, the pen is light — the reference sheet's
       own choice on its right-hand panel. This is also where the two systems meet,
       so it is written down: the light still answers to the VISITOR'S scheme
       (these two blocks), the sky still answers to ABUJA's hour
       (`html[data-abj="night"]` above and below), and the ink answers to the
       scheme because it is ink ON that scheme's paper. */
    @media (prefers-color-scheme: dark) {
        :root {
            --dn-haze: rgba(226,186,118,.11);  --dn-haze-0: rgba(226,186,118,0);
            --dn-ink: rgba(240,234,221,.30);
            --dn-star: rgba(240,234,221,.52);
            --dn-lit: #e8b96b;
        }
        html[data-abj="night"] {
            --dn-haze: rgba(126,140,182,.12);  --dn-haze-0: rgba(126,140,182,0);
        }
        /* The DEEP FIELD belongs to this block and no other, and it is now the
           only thing that does: the streak used to be in here with it, which is
           why a phone in light mode after dark had no shooting star in it at
           all. A dark-mode visitor at midnight gets the same quiet night every
           surface gets, with a field of dust standing in it.

           SELECTED ON `html` RATHER THAN ON THE CLASS ALONE, which is not
           decoration. This block is written above the mural's own rules, and a
           media query is not a cascade layer — it carries no weight of its own,
           so a bare `.dn-deep` here and a bare `.dn-deep` down there are the same
           rule at the same specificity and the LATER one wins. The first draft
           of this did exactly that and put the deep sky behind an
           `opacity: 0` that never got overruled. One extra element in the
           selector settles it in the direction the cascade is already going. */
        html .dn-deep { opacity: 1; }
    }

    /* THE MURAL, AND IT IS AS BIG AS THE PAGE. `inset: 0` inside a body that is
       its own positioning context means the layer is exactly as wide as the
       window and exactly as tall as the page is long — so the city keeps its
       place at the foot of the page whether a visitor is looking at it or not,
       and a visitor who scrolls has a page under them rather than a window with
       a picture in it. */
    .dn {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        z-index: 0; overflow: hidden; pointer-events: none;
        color: var(--dn-ink);
    }
    /* AND EVERYTHING A VISITOR CAME FOR STANDS ABOVE THE MURAL. The layer is one
       z step behind the three things that were already on this page. */
    .page > .brand, .page > .link-list, .page > .links-footer { position: relative; z-index: 1; }
    /* THE THREE PIECES, EACH HUNG ON THE EDGE IT BELONGS TO.

       THE SKY is as wide as the window and as tall as it is wide: one band of
       weather across the top of the page holding the sun or the crescent, six
       stars and the one cloud, with no horizon in it anywhere — that is the
       whole difference between weather and a picture.

       THE CITY runs the full width along the FOOT of the page, off both of its
       edges, so there is no end of the city to find and no bottom edge to the
       drawing either. It is the widest thing here and the lowest, which is what
       keeps it out of the way of the words that stand over it.

       AND IT HAS A FLOOR, WHICH IS THE ONE NUMBER IN THIS THAT IS A JUDGEMENT.
       Below about 580px the box stops shrinking with the window: a phone whose
       city scaled all the way down with it would carry a 12px skyline in a
       letterbox, which is not a small mural — it is a mural that has failed. So
       the box keeps a 580px floor, hangs off both edges instead, and the drawing
       simply arrives at a size you can read. It is one number rather than a
       breakpoint on purpose: a floor is continuous and a breakpoint jumps, and a
       skyline that pops 40% taller when a window crosses 700px is a skyline
       attached to the window rather than to the page.

       THE PLANT is tied to the page's HEIGHT and grows out of the same ground the
       city stands on, because up is the direction a plant grows in — sizing it by
       width, as the other two are, would give a 2560px window a shrub and a phone
       a sapling, and both would be wrong in different directions. */
    .dn-sky, .dn-city, .dn-branch { display: block; }
    .dn-sky { position: absolute; top: 0; left: 0; right: 0; width: 100%; height: auto; }
    .dn-city { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: max(100%, 580px); height: auto; }
    .dn-branch { position: absolute; bottom: 0; left: 0; height: 36%; aspect-ratio: 88 / 300; }
    /* ON A SHORT WINDOW THERE IS NO COLUMN OF EMPTY PAPER LEFT FOR A PLANT, and
       one tall enough to be a plant would climb straight through the words: an
       844px page gives it 540px of nothing to stand in, and a 568px page gives it
       none at all. So on a short window it is cut back to a sprig standing on the
       city's own ground — small, low, and out of the way of the footer — rather
       than a full branch with its leaves through the contact row. Measured on the
       VIEWPORT's height, because that is the thing that has run out. */
    @media (max-height: 700px) { .dn-branch { height: 20%; } }
    .dn-base, .dn-fore, .dn-day, .dn-night { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    /* ONE PLACE AT TWO HOURS, AND THE CHANGE IS DRAWN RATHER THAN SWAPPED.

       It was a swap: the sun's group was taken out of the page and the moon's
       put in, which is the one way of drawing a transition that cannot have one
       — `display: none` is not something that can be half-way. The two sides are
       now the SAME drawing in the SAME place, cross-faded on OPACITY, and what
       holds them together is the disc: the moon's outer arc IS the sun's own
       circle, at the sun's own centre and radius (see the sky's markup below).
       At dusk a visitor sees the disc lose its right edge and the rays draw back
       into it, rather than one picture being replaced by another.

       NOTHING HERE MOVES A BOX, so nothing below it can reflow — the same rule
       the three movements further down are written under. And because the
       attribute is set in the head, before the first paint, there is no first
       frame showing the wrong side and no transition running on load. */
    .dn-day, .dn-night { transition: opacity .8s ease; }
    .dn-day { opacity: 1; }
    .dn-night { opacity: 0; }
    html[data-abj="night"] .dn-day { opacity: 0; }
    html[data-abj="night"] .dn-night { opacity: 1; }
    /* AND THE RAYS GO IN RATHER THAN OUT: they turn a fifth of a circle and shrink
       towards the disc they came from, so the sun does not blink out of a sky it
       is still in. Written on a wrapper and not on `.dn-rays` itself, because
       that element is already turning under an animation, and an animation
       outranks a transition — a rule written there would never once run. */
    .dn-rays-wrap { transition: transform .9s ease, opacity .8s ease; transform-box: view-box; transform-origin: 523px 85px; }
    html[data-abj="night"] .dn-rays-wrap { opacity: 0; transform: rotate(72deg) scale(.55); }
    /* THE MARKS THAT ARE FILLED rather than drawn — the six stars, and the windows
       a building keeps lit after dark. Given by class and not by attribute,
       because a presentation attribute cannot read a custom property. */
    .dn-star { fill: var(--dn-star); stroke: none; }
    .dn-lit { fill: var(--dn-lit); stroke: none; }
    /* AND WHAT A DARK SURFACE ADDS TO THE SAME NIGHT, which is the one place the
       visitor's scheme is allowed to change more than the ink.

       The hour still decides WHETHER it is night — the sun and the moon are
       Abuja's and nobody else's — and it decides WHAT THE NIGHT IS: the
       crescent, a handful of stars, and the one mark up here that says the word
       out loud, the shooting star. Every surface gets that night, because the
       HOUR is what a shooting star belongs to.

       AND THE SURFACE DECIDES HOW MUCH MORE OF IT THERE IS, where "more" is the
       whole of what it may do: it adds. On paper the after-dark sky is the
       reference sheet's quiet one, in ink. A dark surface opens a deep field
       under it — fourteen specks of dust, half of them twinkling — which is the
       version of this drawing a visitor holding a phone in bed is looking at.

       IT IS ONE GROUP OF EXTRA MARKS, not a second sky. Written as the opacity
       of a parent rather than as a rule on each star, because a child's own
       animation outranks a declaration: a twinkle written on a star that light
       mode had hidden would have twinkled it straight back into view. Nothing
       animates through a parent at zero. */
    .dn-deep { opacity: 0; transition: opacity .8s ease; }
    .dn-shoot { opacity: 0; }

    /* ==== The stamp — where the greeting is from, and at what hour ============

       ONE LINE, ABOVE THE GREETING, and it is the only part of this that costs
       the page any height. It is here rather than floating over the sky because
       it carries INFORMATION — the hour in Abuja, in real text, for anybody who
       cannot see the sky at all — and information does not get to sit behind the
       content. Its 30px came out of the 48px of empty air the greeting used to
       float on, which is why the doors below it are exactly where they were.

       It is written in the PAGE's own ink — --text for the hour, --text-soft for
       the place, --accent for the sun or the moon — rather than in a palette of
       its own, because the stamp belongs to the page and only the sky behind it
       belongs to Abuja. There is nothing else to it: see the note below for the
       box it used to be, and what took the box's place in the line's height. */
    .dn-pill-row { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 0 0 8px; }
    /* NO BOX, AND NOTHING BESIDE IT. The stamp was a bordered pill with a short
       dash drawn out of each side, and the owner's note was that the numbers and
       the letters should sit on the page with nothing around them: the border,
       the fill, the radius and the two dashes are gone, and the hour and the
       place are now set on the page's own air, like the greeting under them.

       WHAT IS LEFT IS THE LINE'S OWN HEIGHT, and it is the one number here that
       is arithmetic rather than taste. The 2px the border used to add is in the
       padding instead — 6px against the old 5px plus a 1px border — so the stamp
       is exactly as tall as it was and every door below it is still where it
       was. A stamp that is trimmed has to pay for it out of the space above it,
       and this one pays out of its own. */
    .dn-pill {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 6px 0; color: var(--text);
    }
    .dn-icon { flex: 0 0 auto; width: 15px; height: 15px; color: var(--accent); display: grid; place-items: center; }
    .dn-icon svg { display: block; width: 100%; height: 100%; grid-area: 1 / 1; transition: opacity .8s ease; }
    /* Both icons are IN the markup and one of them is faded out, rather than the
       script putting the right one in: a stamp that has to wait for a script to
       have a sun would have no sun at all with scripts off. They are STACKED in
       the one 15px box — two grid items in one cell — because two icons in a row
       would be a 30px stamp; and the pair is chosen by the same `data-abj` the
       sky is, so the icon and the sky cannot disagree. Being in the same cell is
       also what makes them dissolve into each other rather than cut, which is
       the same gesture the sky makes. The selectors are written as
       `.dn-icon .dn-day-icon` on purpose, because `.dn-icon svg` is more
       specific than a bare class and the first version of this shipped both
       icons at once. */
    .dn-icon .dn-night-icon { opacity: 0; }
    html[data-abj="night"] .dn-icon .dn-day-icon { opacity: 0; }
    html[data-abj="night"] .dn-icon .dn-night-icon { opacity: 1; }
    .dn-clock { font-size: 12px; font-weight: 500; letter-spacing: .2px; font-variant-numeric: tabular-nums; }
    /* Until the clock has been read there is no clock, and an empty element is
       not a placeholder — it is taken out of the layout rather than shown as a
       dash, and the separator before the place goes with it. With no script at
       all the stamp reads "GMT+1 · Abuja", which is the half of it that is true
       every hour of the day. */
    .dn-clock:empty { display: none; }
    .dn-place { font-size: 10.5px; letter-spacing: .4px; color: var(--text-soft); }
    .dn-clock:not(:empty) + .dn-place::before { content: "\00b7"; margin-right: 6px; opacity: .55; }

    /* THE THREE MOVEMENTS, AND WHY THEY ARE THESE THREE. All are the same kind
       of thing: a change of presence, never a journey across the screen. A
       reveal that MOVED would reflow what stands over it on the frame a phone
       can least afford, so the stars breathe on opacity, the sun's rays turn on
       a transform, and nothing here touches a box at all. The sun turns once
       every four minutes and the clouds cross seven pixels in nearly two — slow
       enough to be felt rather than watched, which is the only kind of moving a
       page that already has a visitor's attention should do.

       THE FOURTH IS NOT HERE, because it is not a movement but a change of
       hour: the sun becoming the moon, up at the top of this block. It is
       spelled out there rather than looped in here, because a page that ran the
       sunset on a timer would be performing dusk rather than reading it — this
       page's dusk happens when Abuja's does, once, and then it stays. */
    @media (prefers-reduced-motion: no-preference) {
        .dn-tw { animation: dn-twinkle 6.4s ease-in-out infinite; }
        .dn-tw:nth-of-type(3n+1) { animation-delay: -1.6s; }
        .dn-tw:nth-of-type(3n+2) { animation-delay: -3.4s; }
        .dn-tw:nth-of-type(3n)   { animation-delay: -5.1s; }
        .dn-rays { animation: dn-turn 240s linear infinite; transform-box: view-box; transform-origin: 523px 85px; }

    <!-- THE ONE THING THIS PAGE HAS TO ASK, AND IT ASKS IT BEFORE THE PAGE PAINTS.

         The page is drawn in one place and two lights — the same Abuja, drawn at
         midday and after dark — and a visitor should be shown the one that is
         true where the studio is, not whichever one a designer last looked at. So
         the page reads Abuja's own clock and stamps the answer onto the document
         element, which the stylesheet has already been written to expect. The
         hour decides the SKY (the sun, the crescent, the stars, the windows that
         are lit); the visitor's own colour scheme decides the surface, and the
         note over the Day / Night styles is where that split is argued.

         WHY IT IS IN THE HEAD AND NOT AT THE FOOT OF THE BODY. An attribute set
         after the sky had painted would show a visitor a moment of the wrong day
         — literally: the sun would be up and then the moon would arrive over it.
         A mark that is briefly wrong is worse than one that arrives a moment
         late, the same reason the assistant's face is left empty until the
         studio's chosen look is known.

         IT OPENS NOTHING. No fetch, no request, no storage, not even a cookie:
         it reads a clock and sets one attribute. The zone is asked for by name
         (Africa/Lagos), and Nigeria has kept UTC+1 without interruption, so the
         arithmetic fallback further down is not a guess at an offset — it IS the
         offset, every day of the year, which is why no date is needed to work it
         out. If the script never runs at all the page is simply the daytime
         side, which is what the markup was written as. -->
    <script>
    (function () {
        var SUN_UP = 6, SUN_DOWN = 18;   /* the hours the sun is up where the studio is */

        function abuja() {
            /* The browser's own knowledge of the zone where it has it, so the
               number and the name of the zone cannot disagree. */
            try {
                var parts = new Intl.DateTimeFormat('en-GB', {
                    timeZone: 'Africa/Lagos', hour: 'numeric', minute: '2-digit', hour12: true
                }).formatToParts(new Date()), h = 12, m = '00', pm = false, i, p;
                for (i = 0; i < parts.length; i++) {
                    p = parts[i];
                    if (p.type === 'hour') h = parseInt(p.value, 10);
                    else if (p.type === 'minute') m = p.value;
                    else if (p.type === 'dayPeriod') pm = /^p/i.test(p.value);
                }
                return {
                    hour: (h % 12) + (pm ? 12 : 0),
                    label: (h % 12 === 0 ? 12 : h % 12) + ':' + m + ' ' + (pm ? 'PM' : 'AM')
                };
            } catch (e) {
                var d = new Date(Date.now() + 3600000), hh = d.getUTCHours(), mm = d.getUTCMinutes();
                return {
                    hour: hh,
                    label: (hh % 12 === 0 ? 12 : hh % 12) + ':' + (mm < 10 ? '0' + mm : mm) + ' ' + (hh < 12 ? 'AM' : 'PM')
                };
            }
        }

        function paint() {
            var t = abuja();
            document.documentElement.setAttribute('data-abj', (t.hour >= SUN_UP && t.hour < SUN_DOWN) ? 'day' : 'night');
            var el = document.querySelector('[data-dn-clock]');
            if (el) el.textContent = t.label;
        }

        paint();
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint);

           at the afternoon, so the answer is re-read once a minute — the smallest
           interval that can never be wrong by more than the minute it waits. */
        try { setInterval(paint, 60000); } catch (e) {}
    })();

<!-- ONE REQUEST, AND THE PAGE DOES NOT NEED IT.

     Until 10 October 2026 this page opened no connection of its own. The last
     fetch it ever had was /api/settings, for an Instagram handle that no longer
     exists, and with that gone the page had nothing left to ask for. It has
     exactly one thing to ask for now: the cards themselves. Their titles, the
     line under each one and where each one goes are rows the studio edits from
     the dashboard, so the page reads them and draws the list from what comes
     back (db/migrations/0031, routes/links.js in the studio's own records).

     WHAT HAPPENS WHEN THAT READ FAILS IS THE POINT OF THE WHOLE ARRANGEMENT.
     The two cards above are markup, in this file, and they are what a visitor
     sees unless the read succeeds with at least one usable card. No JavaScript,
     a phone on a bad connection, the API asleep, the records empty: every one of
     those renders the two cards this page was built with, and none of them is an
     empty page. The request can only ever ADD to what is already here — which is
     also why the studio can be strict about what a card may contain without
     risking the page they are editing.

     IT IS THE LAST THING ON THE PAGE AND IT BLOCKS NOTHING. The markup above is
     parsed and painted before this runs, and the list is replaced only once an
     answer has arrived, so the first paint does not wait on the API.

     AND A CARD IS CHECKED AGAIN HERE BEFORE IT IS DRAWN. The server validates
     every card it stores, and this repeats the two parts of that which matter to
     a page: the destination is https or mailto and nothing else, and the words
     are set as TEXT, never as markup. A page whose only guard against a
     javascript: destination is a rule living on a server it does not own is
     trusting something it cannot see. -->
<script>
(function () {
    var API = 'https://api.libertymusa.com';
    /* The marks this page can draw, by the name a card stores. The first two are
       the page's own and are copied here exactly as they are drawn above; the
       rest were fitted to the same box and the same 1.6 stroke so a card the
       studio adds does not look like a different site. A name that is not in
       here draws as a link, so an unknown mark is never a hole in a card. */
    var ICONS = {
        camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle>',
        heart: '<path d="M10.5 10.7C10.2 10.3 9.9 9.6 9.6 8.85C8.9 8.6 7.7 8.6 6.5 8.8C5.2 9 4.1 9.2 3.5 9.9C2.8 10.7 2.9 11.7 3.5 12.6C4.1 13.9 5.6 15.2 7.4 15.8C8.2 16 9.5 16.5 10.1 16.8C11 16 11.5 15.3 11.9 14.6C12.6 13.5 13.4 11.7 13.8 10.3C14.1 9.1 13.6 7.8 12.6 7.4C11.7 7.1 10.6 7.8 9.7 8.85" stroke-width="1.4"/><path d="M0.4 18.8C1.2 19 2.4 19 3.6 18.8C4.8 18.6 5.6 18.3 6.8 17.9C7.8 17.6 8.4 17.3 9.4 16.7C10.2 16.1 10.6 15.9 11.4 15.8C12.2 15.7 13.4 16.1 14.2 15.7C15 15.4 15.9 15.1 16.6 14.6C17.5 13.9 18.3 13 19.1 12C20.2 10.4 20.9 8.4 21.7 7.1C22.4 6.1 22.9 5.4 23.4 5" stroke-width="1.4"/><path d="M18.9 8.4C20.5 7.3 22.1 6.2 23.5 5" stroke-width="1.25"/><path d="M23.5 5C23 6.6 23 8.7 23.3 10.3" stroke-width="1.25"/><path d="M5.3 10.3C4.8 10.8 4.7 11.5 5 12.3" stroke-width="1.25"/>',
        calendar: '<rect x="3.2" y="5" width="17.6" height="15.4" rx="2.4"></rect><path d="M3.2 10.2h17.6"></path><path d="M8 3.2v3.4"></path><path d="M16 3.2v3.4"></path><path d="M8 14.2h3.4v3.4H8z"></path>',
        mail: '<rect x="2.6" y="5.2" width="18.8" height="13.6" rx="2.4"></rect><path d="M3.4 6.8 12 13.1l8.6-6.3"></path>',
        chat: '<path d="M20.6 15.3a2.3 2.3 0 0 1-2.3 2.3H7.7L3.6 21V5.4a2.3 2.3 0 0 1 2.3-2.3h12.4a2.3 2.3 0 0 1 2.3 2.3z"></path><path d="M7.6 9.1h8.8"></path><path d="M7.6 12.4h5.6"></path>',
        star: '<polygon points="12 2.6 15 9.3 22 10 16.8 14.6 18.3 21.4 12 17.8 5.7 21.4 7.2 14.6 2 10 9 9.3"></polygon>',
        gallery: '<rect x="2.8" y="4.6" width="18.4" height="14.8" rx="2.2"></rect><circle cx="8.4" cy="9.8" r="1.6"></circle><path d="M20.4 15.6 16.1 10.6 5.4 21"></path>',
        arrow: '<path d="M4.4 12h13.4"></path><path d="M12.6 6.4 19.2 12l-6.6 5.6"></path>',
        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke-width="1.5"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke-width="1.5"></path>'
    };
    /* The ceiling, and it is the same six the studio's records refuse a seventh
       of. The page would never draw more than the server will give it; this is
       here so a page holding a stale answer cannot outlive the rule. */
    var MAX = 6;

    /* https and mailto, and nothing else. Deliberately NOT a list of the schemes
       to refuse: `javascript:` is one of dozens, and the ones that are not on a
       list yet are the reason a list is the wrong shape. */
    function safeHref(raw) {
        var value = String(raw == null ? '' : raw).trim();
        if (!/^(https:\/\/|mailto:)/i.test(value)) return '';
        if (/\s/.test(value)) return '';
        return value;
    }

    function mark(key) {
        var inner = ICONS[key] || ICONS.link;
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
    }

    /* Built with createElement and textContent rather than as one HTML string:
       the card's own words are then TEXT by construction and there is no step
       where they could be read as tags, whatever a card happens to contain. */
    function cardFor(card) {
        var href = safeHref(card.href);
        if (!href) return null;
        var a = document.createElement('a');
        a.className = 'link-card';
        a.setAttribute('href', href);
        var icon = document.createElement('div');
        icon.className = 'link-icon';
        icon.innerHTML = mark(card.icon);
        var text = document.createElement('div');
        text.className = 'link-text';
        var title = document.createElement('div');
        title.className = 'link-title';
        title.textContent = card.title || '';
        var desc = document.createElement('div');
        desc.className = 'link-desc';
        desc.textContent = card.description || '';
        text.appendChild(title);
        text.appendChild(desc);
        a.appendChild(icon);
        a.appendChild(text);
        return a;
    }

    function redraw(items) {
        var cards = items.filter(function (c) { return c && !c.isHidden; }).slice(0, MAX);
        if (!cards.length) return;
        var nav = document.querySelector('nav.link-list');
        if (!nav) return;
        var drawn = [];
        cards.forEach(function (card) {
            var el = cardFor(card);
            if (el) drawn.push(el);
        });
        /* Not one card survived the check above: the page keeps exactly what it
           has rather than becoming a list with a hole in it. */
        if (!drawn.length) return;
        /* The assistant's door is a door and stays first — it is the one entry
           that answers rather than sends you somewhere, and it is the widget's
           to fill, never this script's. */
        var door = document.getElementById('links-ask');
        var at = door ? door.nextSibling : nav.firstChild;
        Array.prototype.slice.call(nav.querySelectorAll('.link-card')).forEach(function (el) {
            nav.removeChild(el);
        });
        drawn.forEach(function (el) {
            nav.insertBefore(el, at);
        });
    }

    try {
        fetch(API + '/api/links', { headers: { Accept: 'application/json' } })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) {
                if (!data || !Array.isArray(data.items)) return;
                redraw(data.items);
            })
            .catch(function () { /* the two cards above are the answer */ });
    } catch (e) { /* ditto: an old browser without fetch keeps its own cards */ }
})();
</script>
