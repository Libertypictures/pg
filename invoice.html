<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <style>
        :root {
            --bg-body: #f5f2ec; --bg-container: #ffffff; --bg-card: #fdfcf9; --bg-booking: #f7f4ee;
            --text-primary: #1a1815; --text-secondary: #6b6459; --text-faint: #9a9285;
            --accent: #8a7355; --accent-deep: #6e5c44; --accent-soft: rgba(138,115,85,0.12);
            --green: #4a7a4a; --green-soft: rgba(90,140,90,0.13);
            --red: #a8453a; --red-soft: rgba(180,80,70,0.11);
            --border-color: #e8e3d9; --border-dashed: #d8d1c2;
            --shadow-card: 0 2px 6px rgba(26,24,21,0.04), 0 24px 56px rgba(26,24,21,0.07);
            --radius-lg: 20px; --radius-md: 12px; --radius-sm: 8px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #141310; --bg-container: #1f1e1b; --bg-card: #232220; --bg-booking: #1c1b18;
                --text-primary: #f3f0ea; --text-secondary: #a8a196; --text-faint: #7d776c;
                --accent: #c4a67e; --accent-deep: #d9bf98; --accent-soft: rgba(196,166,126,0.14);
                --green: #7fb37f; --green-soft: rgba(110,160,110,0.16);
                --red: #d47a6e; --red-soft: rgba(200,110,100,0.14);
                --border-color: #35332d; --border-dashed: #423f37;
                --shadow-card: 0 2px 6px rgba(0,0,0,0.2), 0 24px 56px rgba(0,0,0,0.28);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        body {
            font-family: 'Poppins', sans-serif; background: var(--bg-body); color: var(--text-primary);
            line-height: 1.6; -webkit-font-smoothing: antialiased; padding: 28px 16px 40px;
            opacity: 0; animation: lp-page-in 0.6s ease 0.05s forwards;
        }
        @keyframes lp-page-in { to { opacity: 1; } }
        .serif { font-family: 'Fraunces', serif; }

        /* NO FLOATING MARK. The script logo used to sit on the page background
           above the card, with padding of its own, so the invoice opened with a
           small logo, a gap, and then a card repeating the studio's name — the
           owner's "too lavish and too apart from the invoice" (22 Oct 2026).
           The studio's identity on this page is its name in the document's own
           type, which is what a letterhead is. The uploaded logo is 750x600
           with the ink occupying 394x166 of it, so at any height that fits a
           masthead the script drew 7px tall — a smudge beside the name, not a
           mark. The site's other pages keep it: there, it is a page mark. */
        .doc-identity { display: flex; align-items: center; min-height: 22px; }

        .container { max-width: 660px; margin: 0 auto; }

        .state-message { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-size: 14px; }

        .invoice-card {
            background: var(--bg-container); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card); padding: 40px 44px 36px; display: none; overflow: hidden;
        }
        .invoice-card.is-visible { display: block; }

        /* MASTHEAD — the document says what it is: brand, its own letterhead,
           then the word INVOICE beside the number and the two dates. The
           number and the dates used to be a grey mono footnote under the
           amount, which is the one place an invoice's identity should never
           be. */
        .doc-head { padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
        .doc-head-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .doc-brand { font-size: 18px; font-weight: 500; letter-spacing: 0.2px; }
        .doc-letterhead { margin-top: 5px; font-size: 12px; color: var(--text-secondary); line-height: 1.65; overflow-wrap: break-word; }
        .doc-letterhead a { color: var(--text-secondary); text-decoration: none; }
        @media (hover: hover) { .doc-letterhead a:hover { color: var(--accent); } }
        /* A detail and its leading separator travel together, so a narrow screen
           starts a line with "· WhatsApp" instead of ending one with a dot. */
        .doc-chunk { white-space: nowrap; }
        .doc-sep { margin: 0 6px; opacity: 0.55; }
        .doc-ident { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-dashed); }
        .doc-wordmark { font-size: 10px; font-weight: 600; letter-spacing: 2.4px; text-transform: uppercase; color: var(--text-faint); }
        .doc-number { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; letter-spacing: 0.4px; }
        .doc-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-top: 10px; }
        .doc-meta dt { font-size: 9.5px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-faint); margin-bottom: 3px; }
        .doc-meta dd { font-size: 12.5px; color: var(--text-primary); }

        .status-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.1px; padding: 6px 14px; border-radius: 30px; border: 1px solid transparent; white-space: nowrap; flex-shrink: 0; }
        .status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .status-pill.is-paid { background: var(--green-soft); color: var(--green); }
        .status-pill.is-unpaid { background: var(--accent-soft); color: var(--accent-deep); }
        .status-pill.is-overdue { background: var(--red-soft); color: var(--red); }

        /* Bill to, then the amount — the two facts a client comes for, in
           the order a document reads rather than as a headline */
        .party-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-faint); font-weight: 600; margin-bottom: 7px; }
        .party-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
        .party-line { font-size: 12.5px; color: var(--text-secondary); line-height: 1.65; word-break: break-word; }
        .doc-amount { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin: 14px 0 18px; padding: 13px 16px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
        .hero-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.6px; color: var(--text-faint); font-weight: 600; white-space: nowrap; }
        .hero-amount { font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; letter-spacing: -0.4px; line-height: 1.05; font-variant-numeric: tabular-nums; text-align: right; }

        /* The itemised table — a quantity column, so the rows read as an
           invoice's rows and not as a list of sentences with prices */
        .invoice-items { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        .invoice-items th { text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-faint); padding-bottom: 8px; border-bottom: 1px solid var(--border-color); font-weight: 600; }
        .invoice-items td { padding: 11px 0; border-bottom: 1px solid var(--border-dashed); font-size: 13px; vertical-align: top; }
        .invoice-items .c-qty { text-align: right; width: 32px; padding-left: 10px; white-space: nowrap; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        .invoice-items .c-amt { text-align: right; padding-left: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .invoice-items tr:last-child td { border-bottom: none; }
        .item-name { font-weight: 500; }
        .item-details { margin-top: 4px; font-size: 12px; color: var(--text-secondary); line-height: 1.6; }

        .invoice-totals { max-width: 280px; margin: 2px 0 0 auto; border-top: 1px solid var(--border-color); padding-top: 8px; }
        .invoice-totals .total-row { display: flex; justify-content: space-between; gap: 18px; font-size: 12.5px; padding: 5px 0; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        .invoice-totals .total-row.is-paid-so-far { color: var(--green); font-weight: 500; }
        .invoice-totals .total-row.grand { border-top: 1px solid var(--border-color); margin-top: 6px; padding-top: 10px; font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .invoice-totals .total-row.grand .amt { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; }

        /* Notes keep their own lines — the stored text is written as lines and
           HTML collapses them into one paragraph (docs/decisions/0060). */
        /* TERMS AT THE FOOT. They used to sit between the ledger and the pay
           buttons, so the last thing before "Pay in full" was a wall of small
           print — and the owner's second look at the page on 22 October 2026
           was "a client might not bother to scroll to the end". The button that
           pays now follows the total it pays. */
        .doc-notes { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-color); }
        .doc-section-title { font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.6px; color: var(--text-faint); font-weight: 600; margin-bottom: 8px; }
        .doc-notes-body { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; white-space: pre-line; }

        /* HOW TO PAY — a panel of its own, below the document it pays */
        .doc-pay { margin-top: 16px; padding: 15px 14px 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
        .doc-pay .doc-section-title { margin-bottom: 12px; }
        .invoice-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-pay {
            display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
            background-color: rgba(26,24,21,0.92); color: #fff; padding: 16px 24px; font-size: 12.5px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 1.4px; border: none; border-radius: 14px;
            cursor: pointer; transition: background-color 0.3s cubic-bezier(0.16,1,0.3,1), color 0.3s cubic-bezier(0.16,1,0.3,1), border-color 0.3s cubic-bezier(0.16,1,0.3,1), box-shadow 0.3s cubic-bezier(0.16,1,0.3,1), opacity 0.3s cubic-bezier(0.16,1,0.3,1), transform 0.3s cubic-bezier(0.16,1,0.3,1), filter 0.3s cubic-bezier(0.16,1,0.3,1);
            box-shadow: 0 10px 24px rgba(26,24,21,0.18);
        }
        .btn-pay .btn-pay-amount { font-size: 15px; letter-spacing: 0.3px; font-variant-numeric: tabular-nums; }
        @media (hover: hover) { .btn-pay:hover { background-color: rgba(138,115,85,0.95); transform: translateY(-1px); box-shadow: 0 16px 32px rgba(138,115,85,0.28); } }
        .btn-pay:disabled { background-color: var(--border-color); color: var(--text-secondary); cursor: not-allowed; transform: none; box-shadow: none; }
        .pay-or { text-align: center; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.6px; color: var(--text-faint); padding: 4px 0; }
        /* HOW, THEN HOW MUCH (docs/decisions/0080): one choice of channel, on by
           default for the transfer, above the amounts. */
        .pay-ways { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .pay-ways-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.6px; color: var(--text-faint); }
        .pay-way { padding: 7px 16px; border: 1px solid var(--border-color); border-radius: 20px; background: transparent; color: var(--text-secondary); font-family: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px; cursor: pointer; }
        .pay-way.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }
        @media (hover: hover) { .pay-way:hover { border-color: var(--accent); } }
        .btn-secondary {
            display: block; width: 100%; text-align: center; background: transparent; border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 13px 24px; font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1.2px; border-radius: 12px; cursor: pointer; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease, transform 0.25s ease, filter 0.25s ease;
        }
        @media (hover: hover) { .btn-secondary:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); } }
        @media (prefers-color-scheme: dark) { .btn-secondary { background: rgba(255,255,255,0.04); } }

        .pay-trust { display: flex; align-items: flex-start; gap: 7px; margin-top: 12px; font-size: 11px; line-height: 1.55; color: var(--text-faint); }
        .pay-trust svg { opacity: 0.7; margin-top: 2px; flex-shrink: 0; }

        .doc-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-color); flex-wrap: wrap; }
        .doc-actions button { flex: 1; min-width: 120px; background: transparent; border: none; color: var(--text-secondary); font-size: 11px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 8px; border-radius: 8px; transition: color 0.15s ease, background 0.15s ease; }
        @media (hover: hover) { .doc-actions button:hover { color: var(--accent); background: var(--accent-soft); } }

        /* Paid state */
        .paid-banner { display: flex; align-items: center; gap: 16px; background: var(--green-soft); border: 1px solid rgba(90,140,90,0.25); border-radius: 14px; padding: 20px 22px; }
        .paid-banner .check-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 8px 20px rgba(90,140,90,0.25); }
        .paid-banner p { font-size: 12.5px; color: var(--text-secondary); margin: 0; }
        .paid-banner strong { display: block; font-size: 15px; color: var(--text-primary); margin-bottom: 2px; font-weight: 600; }

        .partial-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent-soft); border: 1px solid rgba(138,115,85,0.25); border-radius: 12px; padding: 14px 18px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; flex-wrap: wrap; }
        .partial-banner strong { color: var(--text-primary); font-variant-numeric: tabular-nums; }

        .brand-footer { max-width: 660px; margin: 26px auto 0; padding-top: 18px; border-top: 1px solid var(--border-color); text-align: center; }
        .footer-contact { margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
        .footer-contact a { color: var(--text-secondary); text-decoration: none; }
        @media (hover: hover) { .footer-contact a:hover { color: var(--accent); } }
        .footer-contact-divider { margin: 0 10px; opacity: 0.5; }

        /* JPEG capture target — a plain, high-contrast rendering,
           separate from the live theme-following card above it, same
           reasoning as the Book page receipt: a saved document
           shouldn't silently change appearance based on the viewer's
           color scheme. */
        .invoice-capture { display: none; }
        .invoice-capture.is-active {
            display: block; position: absolute; left: 0; right: 0; top: 0; z-index: 200;
            background: #ffffff; color: #1a1815; padding: 48px 40px; font-family: 'Poppins', sans-serif;
            min-height: 100vh; width: 100%;
        }
        .invoice-capture .cap-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; border-bottom: 2px solid #1a1815; padding-bottom: 16px; margin-bottom: 22px; }
        .invoice-capture .cap-wordmark { font-size: 10px; font-weight: 600; letter-spacing: 2.4px; text-transform: uppercase; color: #6b6459; }
        .invoice-capture .cap-brand { font-size: 20px; font-weight: 500; margin-top: 2px; }
        .invoice-capture .cap-head-right { text-align: right; }
        .invoice-capture .cap-number { font-size: 12px; letter-spacing: 1px; color: #1a1815; font-family: ui-monospace, Menlo, monospace; }
        .invoice-capture .cap-status { margin-top: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: #6b6459; }
        .invoice-capture .cap-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin-bottom: 18px; }
        .invoice-capture .cap-parties span, .invoice-capture .cap-meta span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #6b6459; margin-bottom: 4px; }
        .invoice-capture .cap-parties strong, .invoice-capture .cap-meta strong { font-size: 13px; font-weight: 500; word-break: break-word; }
        .invoice-capture .cap-parties em { display: block; font-style: normal; font-size: 11.5px; color: #6b6459; line-height: 1.6; margin-top: 2px; }
        .invoice-capture .cap-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-bottom: 24px; padding-top: 16px; border-top: 1px solid #e8e3d9; }
        .invoice-capture table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
        .invoice-capture th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: #6b6459; padding-bottom: 9px; border-bottom: 1px solid #1a1815; }
        .invoice-capture td { padding: 12px 0; border-bottom: 1px dashed #e8e3d9; font-size: 13px; vertical-align: top; }
        .invoice-capture .cap-qty { text-align: right; width: 32px; padding-left: 10px; white-space: nowrap; color: #6b6459; }
        .invoice-capture .cap-amt { text-align: right; padding-left: 14px; white-space: nowrap; }
        .invoice-capture .cap-item-details { margin-top: 4px; font-size: 11.5px; color: #6b6459; line-height: 1.6; }
        .invoice-capture .cap-totals { max-width: 300px; margin-left: auto; border-top: 1px solid #e8e3d9; padding-top: 8px; }
        .invoice-capture .cap-totals > div { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; color: #6b6459; }
        .invoice-capture .cap-totals .grand { border-top: 1px solid #1a1815; margin-top: 6px; padding-top: 10px !important; font-weight: 600; color: #1a1815 !important; font-size: 14px !important; }
        .invoice-capture .cap-notes { margin-top: 22px; padding-top: 14px; border-top: 1px solid #e8e3d9; white-space: pre-line; font-size: 11.5px; color: #6b6459; line-height: 1.7; }
        .invoice-capture .cap-footer { margin-top: 32px; text-align: center; font-size: 12px; color: #6b6459; font-style: italic; }

        /* Print: a clean document PDF via the browser's save dialog */
        @media print {
            body { padding: 0; background: #fff; opacity: 1; animation: none; }
            .brand-footer, .state-message, .doc-pay, .doc-actions { display: none !important; }
            .container { max-width: 100%; }
            .invoice-card { border: none; box-shadow: none; border-radius: 0; padding: 0; }
            .doc-amount { margin-bottom: 18px; }
        }

        @media (max-width: 600px) {
            body { padding: 20px 12px 28px; }
            .invoice-card { padding: 20px 16px 18px; border-radius: 16px; }
            .doc-brand { font-size: 17px; }
            .hero-amount { font-size: 28px; }
            .doc-meta { gap: 10px 18px; }
            .invoice-totals { max-width: 100%; }
            .btn-pay { padding: 15px 18px; }
        }

        /* Small phones: the brand and the pill share one tight row, and the
           amount gives way rather than the label wrapping mid-phrase. */
        @media (max-width: 380px) {
            .doc-brand { font-size: 16px; }
            .status-pill { font-size: 9.5px; letter-spacing: 0.9px; padding: 5px 10px; }
            .doc-amount { padding: 14px 14px; }
            .hero-amount { font-size: 24px; }
            .invoice-card { padding: 18px 14px 16px; }
            /* Too narrow to sit an email and a phone on one line: one per line,
               with no separator left stranded in front of the second. */
            .party-line .doc-chunk { display: block; }
            .party-line .doc-sep { display: none; }
            /* The pill row, the retainer button and the two document actions
               each have less room than they were drawn for. */
            .pay-way { padding: 6px 12px; font-size: 11px; }
            .btn-secondary { font-size: 10px; letter-spacing: 1px; padding: 12px 12px; }
            .doc-actions button { min-width: 0; }
        }
    </style>

<body>

    <div class="container">
        <div class="state-message" id="state-message">Loading your invoice&hellip;</div>

        <div class="invoice-card" id="invoice-card">
            <header class="doc-head">
                <div class="doc-head-top">
                    <div class="doc-identity">
                        <div class="doc-brand serif" id="doc-brand">Libertypictures</div>
                    </div>
                    <span class="status-pill" id="inv-status-pill"></span>
                </div>
                <div class="doc-letterhead" id="inv-from-line"></div>
                <div class="doc-ident">
                    <span class="doc-wordmark">Invoice</span>
                    <span class="doc-number" id="inv-number"></span>
                </div>
                <dl class="doc-meta">
                    <div><dt>Issued</dt><dd id="inv-issued"></dd></div>
                    <div><dt>Due</dt><dd id="inv-due"></dd></div>
                </dl>
            </header>

            <section class="party-block">
                <div class="party-label">Bill to</div>
                <div class="party-name" id="inv-client-name"></div>
                <div class="party-line" id="inv-client-line"></div>
            </section>

            <div class="doc-amount">
                <div class="hero-label" id="hero-label">Amount due</div>
                <div class="hero-amount" id="inv-amount"></div>
            </div>

            <table class="invoice-items">
                <thead><tr><th>Description</th><th class="c-qty">Qty</th><th class="c-amt">Amount</th></tr></thead>
                <tbody id="inv-items-body"></tbody>
            </table>

            <div class="invoice-totals" id="inv-totals"></div>

            <section class="doc-pay">
                <h2 class="doc-section-title" id="pay-title">How to pay</h2>
                <div id="invoice-actions">
                    <!-- populated by renderPaymentActions() based on status -->
                </div>
            </section>

            <section class="doc-notes" id="inv-notes" hidden>
                <h2 class="doc-section-title">Terms &amp; notes</h2>
                <div class="doc-notes-body" id="inv-notes-body"></div>
            </section>

            <div class="doc-actions">
                <button type="button" id="download-pdf-btn">Download PDF</button>
                <button type="button" id="save-invoice-btn">Save as image</button>
            </div>
        </div>
    </div>

    <footer class="brand-footer">
        <span class="serif" style="font-size:15px; font-weight:500;">Libertypictures &copy; 2026</span>
        <div class="footer-contact">
            <a href="https://wa.me/2349075170240" target="_blank" rel="noopener">WhatsApp</a>
            <span class="footer-contact-divider">&middot;</span>
            <a href="mailto:visualsliberty@gmail.com">Email</a>
        </div>
    </footer>

    <!-- JPEG capture target — populated and shown only for the instant
         html2canvas needs it, exactly like the Book page receipt. -->
    <div class="invoice-capture" id="invoice-capture">
        <div class="cap-header">
            <div>
                <div class="cap-wordmark">Invoice</div>
                <div class="cap-brand serif">Libertypictures</div>
            </div>
            <div class="cap-head-right">
                <div class="cap-number" id="cap-number"></div>
                <div class="cap-status" id="cap-status"></div>
            </div>
        </div>
        <div class="cap-parties">
            <div><span>Billed to</span><strong id="cap-client-name"></strong><em id="cap-client-email"></em></div>
            <div><span>From</span><strong>Libertypictures</strong><em id="cap-from-line"></em></div>
        </div>
        <div class="cap-meta">
            <div><span>Issued</span><strong id="cap-issued-date"></strong></div>
            <div><span>Due</span><strong id="cap-due-date"></strong></div>
        </div>
        <table>
            <thead><tr><th>Description</th><th class="cap-qty">Qty</th><th class="cap-amt">Amount</th></tr></thead>
            <tbody id="cap-items-body"></tbody>
        </table>
        <div class="cap-totals" id="cap-totals"></div>
        <div class="cap-notes" id="cap-notes" hidden></div>
        <div class="cap-footer">Libertypictures &mdash; thank you for your business.</div>
    </div>

<script>
    var API_BASE = 'https://api.libertymusa.com';
    var PAYSTACK_PUBLIC_KEY = 'pk_live_05373c45337d6a937f51d9c3045c7839369d503d';
    var token = new URLSearchParams(window.location.search).get('t');
    var currentInvoice = null;
    var studioInfo = null;

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = String(str == null ? '' : str);
        return div.innerHTML;
    }
    function formatNaira(n) { return '\u20a6' + Math.round(n || 0).toLocaleString(); }

    /* Details joined by a middot, each with its separator inside the same
       unbreakable piece — so a 320px screen wraps between facts and never
       leaves a dot hanging at the end of a line. */
    function withSeparators(parts) {
        return parts.map(function (part, i) {
            return i === 0
                ? '<span class="doc-chunk">' + part + '</span>'
                : '<span class="doc-chunk"><span class="doc-sep">\u00b7</span>' + part + '</span>';
        }).join('');
    }

    /* The studio's number is stored in Settings exactly as it was last typed, and
       wa.me only opens a chat for an INTERNATIONAL number — so a link built from
       the setting verbatim, which is what this line used to do, opens nothing at
       all. A leading zero becomes the country code. The code is not a guess: it
       is what the hand-written link on this page uses, and what the site's
       structured data declares. Same rule as the assistant widget and
       gallery.html.

       The number itself is quoted nowhere in this file on purpose: a comment
       that names it is a copy of it, and that is the copy nobody updates.

       The old expression also read /\\D/g, which strips backslashes and letter
       D's rather than the punctuation it was written to remove. */
    function waLink(raw, message) {
        var digits = String(raw == null ? '' : raw).replace(/[^0-9]/g, '');
        if (!digits) return null;
        if (digits.charAt(0) === '0') digits = '234' + digits.slice(1);
        else if (digits.length === 10) digits = '234' + digits;   // national form, no trunk zero
        if (digits.length < 12) return null;
        return 'https://wa.me/' + digits + (message ? '?text=' + encodeURIComponent(message) : '');
    }
    function formatDate(iso) {
        if (!iso) return '\u2014';
        try { return new Date(iso).toLocaleDateString('en-NG', { year: 'numeric', month: 'long', day: 'numeric' }); }
        catch (e) { return iso; }
    }

    // SETTINGS — logo, studio address and contacts for the From block,
    // same source as every other page.
    (function () {
        fetch(API_BASE + '/api/settings')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var s = data.settings || {};
                studioInfo = s;
                /* No logo image is loaded here on purpose — see the note above
                   `.doc-identity`: the mark is a page mark, and on this page the
                   studio's name in type is the letterhead. */
                /* The studio's own line under the wordmark — a letterhead, so
                   it sits on one line with separators rather than as four
                   stacked words that read like stray text. */
                var fromLine = [];
                var fromPlain = [];
                if (s.studio_address) {
                    fromLine.push(escapeHtml(s.studio_address));
                    fromPlain.push(s.studio_address);
                }
                var wa = waLink(s.whatsapp_number);
                if (wa) {
                    fromLine.push('<a href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>');
                    fromPlain.push('WhatsApp');
                }
                if (s.instagram_handle) {
                    fromLine.push('<a href="https://instagram.com/' + encodeURIComponent(String(s.instagram_handle).replace(/^@/, '')) + '" target="_blank" rel="noopener">' + escapeHtml(s.instagram_handle) + '</a>');
                    fromPlain.push(String(s.instagram_handle));
                }
                if (fromLine.length) document.getElementById('inv-from-line').innerHTML = withSeparators(fromLine);
                document.getElementById('cap-from-line').textContent = fromPlain.join(' \u00b7 ');
            })
            .catch(function () {});
    })();

    /* WHAT AN INVOICE'S MONEY MAY BE CALLED — one place, three words.

       `partial` means "some payment has been recorded and the total is not
       covered". It does NOT mean the retainer arrived: the retainer on an invoice
       is a 70% suggestion this page offers (a button reading "Pay 70% retainer"),
       never a recorded fact, so a ₦5,000 part payment on a ₦500,000 invoice used
       to be drawn — to the client — as "Retainer Paid" / "Retainer received".
       The amount paid is evidence that MONEY arrived, and nothing about which
       money it was; the words say that, and the balance says the rest. Same rule
       as ADR-0057, which removed the identical word from bookings. */
    function invoiceMoneyWords(status) {
        if (status === 'paid') return { pill: 'Paid', hero: 'Total paid', banner: 'Paid in full' };
        if (status === 'partial') return { pill: 'Part paid', hero: 'Balance due', banner: 'Payment received' };
        if (status === 'overdue') return { pill: 'Overdue', hero: 'Amount due', banner: '' };
        return { pill: 'Payment Due', hero: 'Amount due', banner: '' };
    }

    function applyStatusPill(status) {
        var pill = document.getElementById('inv-status-pill');
        var variant = status === 'paid' ? 'is-paid' : (status === 'partial' ? 'is-unpaid' : (status === 'overdue' ? 'is-overdue' : 'is-unpaid'));
        pill.className = 'status-pill ' + variant;
        pill.textContent = invoiceMoneyWords(status).pill;
    }

    function renderInvoice(inv) {
        /* The document's identity, in the masthead: the number beside the word
           INVOICE, and the two dates under it. */
        document.getElementById('inv-number').textContent = inv.invoiceNumber || '';
        document.getElementById('inv-issued').textContent = formatDate(inv.createdAt);
        document.getElementById('inv-due').textContent = inv.status === 'paid'
            ? (inv.dueDate ? formatDate(inv.dueDate) : 'Settled')
            : (inv.dueDate ? formatDate(inv.dueDate) : 'On receipt');
        applyStatusPill(inv.status);

        /* One rule for the number on the page and the number charged: whole
           naira, from the shared helper. See vendor/money.js. */
        var remaining = LPMoney.wholeNaira(inv.balanceRemaining != null ? inv.balanceRemaining : Math.max(0, (inv.totalAmount || 0) - (inv.amountPaid || 0)));
        document.getElementById('hero-label').textContent = invoiceMoneyWords(inv.status).hero;
        document.getElementById('inv-amount').textContent = formatNaira(inv.status === 'paid' ? inv.totalAmount : (inv.status === 'partial' ? remaining : inv.totalAmount));

        document.getElementById('inv-client-name').textContent = inv.clientName || '—';
        var clientLine = [];
        if (inv.clientEmail) clientLine.push(escapeHtml(inv.clientEmail));
        if (inv.clientPhone) clientLine.push(escapeHtml(inv.clientPhone));
        document.getElementById('inv-client-line').innerHTML = withSeparators(clientLine);

        /* Each row says how many and at what price, so the table reads as an
           itemised invoice rather than a description with a figure beside it. */
        var rows = inv.lineItems.map(function (item) {
            var qty = item.quantity > 0 ? item.quantity : 1;
            var detailsHtml = item.details ? '<div class="item-details">' + escapeHtml(item.details).replace(/\n/g, '<br>') + '</div>' : '';
            var unitHtml = qty > 1 ? '<div class="item-details">' + formatNaira(item.unitPrice) + ' each</div>' : '';
            return '<tr>' +
                '<td><span class="item-name">' + escapeHtml(item.description) + '</span>' + detailsHtml + unitHtml + '</td>' +
                '<td class="c-qty">' + qty + '</td>' +
                '<td class="c-amt">' + formatNaira(item.unitPrice * item.quantity) + '</td>' +
            '</tr>';
        }).join('');
        document.getElementById('inv-items-body').innerHTML = rows;

        var totalsHtml = '<div class="total-row"><span>Subtotal</span><span>' + formatNaira(inv.subtotal) + '</span></div>';
        if (inv.discountAmount) totalsHtml += '<div class="total-row"><span>Discount</span><span>-\u2009' + formatNaira(inv.discountAmount) + '</span></div>';
        if (inv.status === 'partial') {
            totalsHtml += '<div class="total-row is-paid-so-far"><span>Paid so far</span><span>' + formatNaira(inv.amountPaid) + '</span></div>';
            totalsHtml += '<div class="total-row grand"><span>Balance due</span><span class="amt">' + formatNaira(remaining) + '</span></div>';
        } else {
            totalsHtml += '<div class="total-row grand"><span>' + (inv.status === 'paid' ? 'Total paid' : 'Total due') + '</span><span class="amt">' + formatNaira(inv.totalAmount) + '</span></div>';
        }
        document.getElementById('inv-totals').innerHTML = totalsHtml;

        /* The stored note is written as lines; the sheet draws them as lines. */
        var notesSection = document.getElementById('inv-notes');
        if (inv.notes) {
            document.getElementById('inv-notes-body').textContent = inv.notes;
            notesSection.hidden = false;
        } else {
            notesSection.hidden = true;
        }

        renderPaymentActions(inv);

        document.getElementById('invoice-card').classList.add('is-visible');
        document.getElementById('state-message').style.display = 'none';
    }

    // Builds the payment actions for whatever state the invoice is
    // actually in — a full/retainer choice, a single "pay remaining
    // balance" button, or a paid confirmation. Download PDF and
    // Save as image are always available.
    function renderPaymentActions(inv) {
        var actionsEl = document.getElementById('invoice-actions');
        var html = '';
        document.getElementById('pay-title').textContent = inv.status === 'paid' ? 'Payment' : 'How to pay';
        var remaining = inv.balanceRemaining != null ? inv.balanceRemaining : Math.max(0, (inv.totalAmount || 0) - (inv.amountPaid || 0));

        /* ONE CHANNEL PER BUTTON, and the transfer it is on by default. A
           checkout limited to a single channel lands on that channel's own
           screen; offered both, Paystack opens its card form — which is the
           difference between a client being shown the account number and a
           client hunting for it (docs/decisions/0080). */
        var payWays = '<div class="pay-ways" role="group" aria-label="How would you like to pay?">' +
            '<span class="pay-ways-label">Pay by</span>' +
            '<button type="button" class="pay-way is-on" data-pay-channel="bank_transfer">Bank transfer</button>' +
            '<button type="button" class="pay-way" data-pay-channel="card">Card</button>' +
        '</div>';

        if (inv.status === 'paid') {
            html += '<div class="paid-banner">' +
                '<div class="check-circle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>' +
                '<p><strong>' + invoiceMoneyWords('paid').banner + '</strong><span>' + (inv.paidAt ? 'Received ' + formatDate(inv.paidAt) : 'Received') + ' \u2014 thank you for your business.</span></p>' +
            '</div>';
        } else if (inv.status === 'partial') {
            html += payWays;
            html += '<div class="partial-banner"><span>' + invoiceMoneyWords('partial').banner + ' \u2014 <strong>' + formatNaira(inv.amountPaid) + '</strong> paid, <strong>' + formatNaira(remaining) + '</strong> remaining.</span></div>';
            html += '<button type="button" class="btn-pay" data-pay-amount="' + remaining + '" data-pay-label="Pay Remaining Balance">' +
                '<span>Pay remaining balance</span><span class="btn-pay-amount">' + formatNaira(remaining) + '</span></button>';
        } else {
            var full = LPMoney.wholeNaira(inv.totalAmount || 0);
            var retainer = LPMoney.splitNaira(full).retainer;
            html += payWays;
            html += '<button type="button" class="btn-pay" data-pay-amount="' + full + '" data-pay-label="Pay in Full">' +
                '<span>Pay in full</span><span class="btn-pay-amount">' + formatNaira(full) + '</span></button>';
            html += '<div class="pay-or">or</div>';
            html += '<button type="button" class="btn-secondary" data-pay-amount="' + retainer + '" data-pay-label="Pay Retainer">Pay 70% retainer \u2014 ' + formatNaira(retainer) + '</button>';
        }

        html += '<div class="pay-trust">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
            '<span>Paystack takes the payment and adds its fee on top of what you send — about 1.5%, capped at ₦2,000 — so the checkout asks for a little more than the amount above. A transfer and a card cost the same.</span></div>';

        actionsEl.innerHTML = html;

        actionsEl.querySelectorAll('[data-pay-amount]').forEach(function (btn) {
            btn.addEventListener('click', function () { payInvoice(parseFloat(btn.dataset.payAmount), btn); });
        });
        /* The pills only choose which checkout the amount buttons will open. */
        var wayButtons = actionsEl.querySelectorAll('[data-pay-channel]');
        wayButtons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                choosePayChannel(btn.dataset.payChannel);
                wayButtons.forEach(function (other) { other.classList.toggle('is-on', other === btn); });
            });
        });
    }

    /* The document's own actions live in the card's foot, drawn once — not
       rebuilt with the payment panel, so these listeners are bound once. */
    document.getElementById('download-pdf-btn').addEventListener('click', function () { window.print(); });
    document.getElementById('save-invoice-btn').addEventListener('click', saveInvoiceAsJpeg);

    function loadInvoice() {
        if (!token) {
            document.getElementById('state-message').textContent = 'This invoice link looks incomplete \u2014 please check the link your photographer sent you.';
            return;
        }
        fetch(API_BASE + '/api/invoices/public/' + encodeURIComponent(token))
            .then(function (res) {
                if (!res.ok) throw new Error('not found');
                return res.json();
            })
            .then(function (inv) {
                currentInvoice = inv;
                renderInvoice(inv);
            })
            .catch(function () {
                document.getElementById('state-message').textContent = "We couldn't find that invoice \u2014 please check the link, or reach out to Libertypictures directly.";
            });
    }
    loadInvoice();

    // PAYMENT — mirrors the Book page's Paystack flow, but the amount
    // charged depends on which button was clicked (full, retainer, or
    // remaining balance) rather than always being the invoice total.
    /* WHICH CHECKOUT OPENS: anything but an explicit 'card' is a bank transfer,
       so the default survives a button that passes nothing at all
       (docs/decisions/0080). */
    var payChannel = 'bank_transfer';
    function choosePayChannel(want) {
        payChannel = (want === 'card') ? 'card' : 'bank_transfer';
    }

    function payInvoice(amount, btn) {
        if (!currentInvoice || !amount) return;
        if (typeof PaystackPop === 'undefined' || typeof PaystackPop.setup !== 'function') {
            alert('The secure payment window has not loaded yet. Please refresh the page, or message us on WhatsApp and we will take the payment with you.');
            return;
        }
        /* The shared helper is checked here for the same reason as Paystack
           itself: without it the very next line throws, this handler has no
           caller above it to catch that, and the button reads as dead. */
        if (typeof LPMoney === 'undefined') {
            alert('The payment form has not finished loading. Please refresh the page, or message us on WhatsApp and we will take the payment with you.');
            return;
        }

        /* The one number this page charges, rounded by the shared helper rather
           than by a local `Math.round` — one rule for every screen that takes
           money. See vendor/money.js. */
        var kobo = LPMoney.toKobo(amount);
        var moneyProblem = LPMoney.problemWith(kobo);
        if (moneyProblem) {
            alert(moneyProblem + ' Please message us on WhatsApp and we will take the payment directly.');
            return;
        }

        var originalLabel = btn.textContent;
        var handler;
        try {
        handler = PaystackPop.setup({
            key: PAYSTACK_PUBLIC_KEY,
            email: currentInvoice.clientEmail,
            amount: kobo,
            currency: 'NGN',
            /* ONE channel, chosen by the pills above — see choosePayChannel, and
               docs/decisions/0080. */
            channels: [payChannel],
            /* The invoice this charge belongs to, carried on the charge itself.
               The client's browser normally confirms the payment itself straight
               afterwards — but if it never gets the chance, Paystack's webhook
               has only this metadata to know which invoice was paid. The token is
               the same one already in this page's URL, so nothing new is being
               exposed to whoever is paying. */
            metadata: {
                flow: 'invoice',
                invoiceToken: token,
                invoiceNumber: currentInvoice.invoiceNumber || '',
                name: currentInvoice.clientName || '',
                email: currentInvoice.clientEmail || ''
            },
            callback: function (response) {
                confirmInvoicePayment(response.reference, amount);
            },
            onClose: function () {
                // No alert here — closing the checkout isn't an error,
                // just the client changing their mind mid-flow.
            }
        });
        } catch (err) {
            /* A throw here used to be silent: no popup, no message. */
            alert('We could not open the secure payment window' +
                (err && err.message ? ' (' + err.message + ')' : '') +
                '. Nothing has been charged \u2014 please message us on WhatsApp and we will take the payment with you.');
            return;
        }
        if (!handler || typeof handler.openIframe !== 'function') {
            alert('The secure payment window did not start. Nothing has been charged \u2014 please refresh the page.');
            return;
        }
        try {
            handler.openIframe();
        } catch (err) {
            alert('The secure payment window could not open. Nothing has been charged \u2014 please refresh the page.');
        }

        async function confirmInvoicePayment(reference, paidAmount) {
            btn.disabled = true;
            btn.textContent = 'Confirming payment\u2026';
            try {
                // Retry transient failures — the server is idempotent per
                // reference, so a retry can never double-apply a payment.
                var updated = null, ok = false;
                for (var attempt = 0; attempt < 3; attempt++) {
                    if (attempt > 0) await new Promise(function (r) { setTimeout(r, 1500 * attempt); });
                    try {
                        var res = await fetch(API_BASE + '/api/invoices/public/' + encodeURIComponent(token) + '/confirm-payment', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ reference: reference, amount: paidAmount }),
                        });
                        updated = await res.json();
                        if (res.ok) { ok = true; break; }
                    } catch (err2) { /* transient — try again */ }
                }
                if (!ok) throw new Error((updated && updated.message) || 'Could not confirm the payment.');
                currentInvoice = updated;
                renderInvoice(updated);
            } catch (err) {
                // Payment went through on Paystack's side even if this
                // save failed — never claim otherwise. Same principle
                // as the booking flow's own payment confirmation.
                btn.disabled = false;
                btn.textContent = 'Retry Confirming Payment';
                alert('Your payment went through (Reference: ' + reference + '), but we hit an issue updating this invoice. Please save this reference and message Libertypictures on WhatsApp so it can be confirmed manually \u2014 nothing has been lost.');
            }
        }
    }

    // SAVE AS IMAGE — same technique as the Book page receipt: populate
    // a plain, theme-independent capture target, rasterize it, download.
    // A named function (not an inline listener) since the button it's
    // attached to is recreated by renderPaymentActions() on every render.
    function saveInvoiceAsJpeg() {
        if (!currentInvoice) return;
        if (typeof html2canvas === 'undefined') {
            alert('Could not load the image export tool \u2014 please check your connection and try again.');
            return;
        }
        var inv = currentInvoice;
        var remaining = inv.balanceRemaining != null ? inv.balanceRemaining : Math.max(0, (inv.totalAmount || 0) - (inv.amountPaid || 0));
        document.getElementById('cap-number').textContent = inv.invoiceNumber;
        document.getElementById('cap-status').textContent = invoiceMoneyWords(inv.status).pill;
        document.getElementById('cap-client-name').textContent = inv.clientName;
        document.getElementById('cap-client-email').textContent = [inv.clientEmail, inv.clientPhone].filter(Boolean).join(' \u00b7 ');
        document.getElementById('cap-issued-date').textContent = formatDate(inv.createdAt);
        document.getElementById('cap-due-date').textContent = inv.status === 'paid'
            ? (inv.dueDate ? formatDate(inv.dueDate) : 'Settled')
            : (inv.dueDate ? formatDate(inv.dueDate) : 'On receipt');

        var rows = inv.lineItems.map(function (item) {
            var qty = item.quantity > 0 ? item.quantity : 1;
            var detailsHtml = item.details ? '<div class="cap-item-details">' + escapeHtml(item.details).replace(/\n/g, '<br>') + '</div>' : '';
            var unitHtml = qty > 1 ? '<div class="cap-item-details">' + formatNaira(item.unitPrice) + ' each</div>' : '';
            return '<tr><td>' + escapeHtml(item.description) + detailsHtml + unitHtml + '</td>' +
                '<td class="cap-qty">' + qty + '</td>' +
                '<td class="cap-amt">' + formatNaira(item.unitPrice * item.quantity) + '</td></tr>';
        }).join('');
        document.getElementById('cap-items-body').innerHTML = rows;

        var totalsHtml = '<div><span>Subtotal</span><span>' + formatNaira(inv.subtotal) + '</span></div>';
        if (inv.discountAmount) totalsHtml += '<div><span>Discount</span><span>-\u2009' + formatNaira(inv.discountAmount) + '</span></div>';
        if (inv.status === 'partial') {
            totalsHtml += '<div><span>Paid so far</span><span>' + formatNaira(inv.amountPaid) + '</span></div>';
            totalsHtml += '<div class="grand"><span>Balance due</span><span>' + formatNaira(remaining) + '</span></div>';
        } else {
            totalsHtml += '<div class="grand"><span>' + (inv.status === 'paid' ? 'Total paid' : 'Total due') + '</span><span>' + formatNaira(inv.totalAmount) + '</span></div>';
        }
        document.getElementById('cap-totals').innerHTML = totalsHtml;

        var capNotes = document.getElementById('cap-notes');
        capNotes.textContent = inv.notes || '';
        capNotes.hidden = !inv.notes;

        var captureEl = document.getElementById('invoice-capture');
        captureEl.classList.add('is-active');
        var btn = document.getElementById('save-invoice-btn');
        var originalText = btn.textContent;
        btn.textContent = 'Preparing\u2026';
        btn.disabled = true;

        html2canvas(captureEl, { backgroundColor: '#ffffff', scale: 2, useCORS: true, scrollY: -window.scrollY }).then(function (canvas) {
            var link = document.createElement('a');
            link.download = 'libertypictures-' + inv.invoiceNumber + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        }).catch(function (err) {
            console.error('Invoice image export failed:', err);
            alert('Could not generate the image \u2014 please try again in a moment.');
        }).finally(function () {
            captureEl.classList.remove('is-active');
            btn.textContent = originalText;
            btn.disabled = false;
        });
    }
</script>

</body></html>
