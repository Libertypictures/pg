<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=31eb723a6e">
    <link rel="stylesheet" href="/vendor/fonts.css?v=2ca4e079b3">
    <style>
        :root {
            --bg-body: #faf8f4;
            --bg-container: #ffffff;
            --text-primary: #1a1815;
            --text-secondary: #6b6459;
            --accent: #8a7355;
            --accent-deep: #6e5c44;
            --border-color: #e8e3d9;
            --border-dashed: #d8d1c2;
            --btn-primary-bg: #1a1815;
            --btn-primary-text: #ffffff;
            --radius-lg: 18px;
            --radius-sm: 6px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #161513;
                --bg-container: #1f1e1b;
                --text-primary: #f3f0ea;
                --text-secondary: #a8a196;
                --accent: #c4a67e;
                --accent-deep: #d9bf98;
                --border-color: #35332d;
                --border-dashed: #423f37;
                --btn-primary-bg: #c4a67e;
                --btn-primary-text: #161513;
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
            -webkit-font-smoothing: antialiased;
        }
        .shell {
            width: 100%;
            max-width: 520px;
            background: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 44px 32px 34px;
            text-align: center;
        }
        .logo { height: 40px; width: auto; margin-bottom: 26px; }
        .code {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 13px;
            letter-spacing: 0.24em;
            color: var(--accent);
            margin: 0 0 14px;
        }
        h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 500;
            font-size: 30px;
            line-height: 1.2;
            margin: 0 0 14px;
            letter-spacing: -0.01em;
        }
        p.lede {
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--text-secondary);
            margin: 0 auto 28px;
            max-width: 400px;
            font-weight: 300;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 26px;
        }
        a.btn {
            display: block;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 0.02em;
            transition: opacity .18s ease, background .18s ease;
        }
        a.btn-primary { background: var(--btn-primary-bg); color: var(--btn-primary-text); }
        @media (hover: hover) { a.btn-primary:hover { opacity: .88; } }
        a.btn-ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border-color); }
        @media (hover: hover) { a.btn-ghost:hover { background: var(--bg-body); } }
        .links {
            border-top: 1px dashed var(--border-dashed);
            padding-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            justify-content: center;
            font-size: 13px;
        }
        .links a { color: var(--text-secondary); text-decoration: none; }
        @media (hover: hover) { .links a:hover { color: var(--accent); } }
        .foot {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.14em;
            color: var(--text-secondary);
            margin-top: 24px;
            opacity: .75;
        }
    </style>
</head>
<body>
    <main class="shell">
        <img class="logo" src="/logo.png?v=fc9b90db8c" alt="Libertypictures">
        <p class="code">404</p>
        <h1>This page isn&rsquo;t in the album.</h1>
        <p class="lede">
            The link may be old, or the gallery may have moved on. Everything else
            is exactly where you left it.
        </p>
        <div class="actions">
            <a class="btn btn-primary" href="/">Back to Libertypictures</a>
            <a class="btn btn-ghost" href="/book.html">Book a session</a>
            <a class="btn btn-ghost" href="/portfolio.html">View the portfolio</a>
        </div>
        <nav class="links">
            <a href="/wedding.html">Weddings</a>
            <a href="/review.html">Leave a review</a>
            <a href="/links.html">All links</a>
            <a href="/status.html">System status</a>
        </nav>
        <p class="foot">&mdash; LIBERTYPICTURES</p>
    </main>
</body>
</html>
